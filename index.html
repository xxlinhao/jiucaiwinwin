function divZone(d){
  if(d>=6.0)return{label:'极度低估',color:'#2980b9',bg:'#d4ebf7',cls:'l0'};
  if(d>=5.5)return{label:'低估',color:'#27ae60',bg:'#d8f0e0',cls:'l1'};

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2&_t='+Date.now();
  function timedFetch(url){
    return Promise.race([
      fetch(url,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}}),
      new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},8000)})
    ]);
  }
  var ps=['https://corsproxy.io/?'+u, 'https://api.allorigins.win/raw?url='+encodeURIComponent(u), u];
  for(var i=0;i<ps.length;i++){
    try{
      var r=await timedFetch(ps[i]);
      if(r.ok){var j=await r.json();if(j&&j.data)return j.data}
    }catch(e){}
  }
  return null;
}

  var promises=CFG.map(function(c){
    var row={name:c.name,code:c.code,cat:c.cat,div:c.div,buy:c.buy,roe:c.roe,divHist:c.divHist,earn:c.earn,divDt:c.divDt,cfo:c.cfo,fcf:c.fcf,cov:c.cov,safe:c.safe,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false};
    return fetchOne(c.mkt,c.code).then(function(raw){
      if(raw&&raw.f43){
        row.price=raw.f43;row.prev=raw.f60||0;
        row.chg=row.prev>0?((row.price-row.prev)/row.prev*100):0;
        row.pe=raw.f162||0;row.pb=raw.f167||0;
        row.mcap=(raw.f116||0)/1e8;
        row.divR=c.div/row.price*100;
        row.dist=(row.price-c.buy)/c.buy*100;
        row.needy=c.buy-row.price;row.ok=true;
      }
      return row;
    }).catch(function(){return row});
  });
  data=await Promise.all(promises);
  try{renderAll();}catch(e){
    var d=document.getElementById('dash');
    if(d)d.innerHTML='<div style="background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin:12px;font-size:12px;white-space:pre-wrap">⚠️ 渲染异常：'+e.message+'\n'+(e.stack||'').split('\n').slice(0,3).join('\n')+'</div>';
  }
  document.getElementById('time').textContent=new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function getStockData(code){for(var i=0;i<data.length;i++)if(data[i].code===code)return data[i];return null}

function buildDivTrend(hist){
  var nums=hist.map(function(v){return parseFloat(v)});
  var w=320,h=80,padL=30,padR=8,padT=8,padB=20;
  var chartW=w-padL-padR,chartH=h-padT-padB;
  var maxN=Math.max.apply(null,nums),minN=Math.min.apply(null,nums);
  var range=maxN-minN||1;
  var pts=[];
  for(var i=0;i<nums.length;i++){
    var px=padL+(i+0.5)*(chartW/nums.length);
    var py=padT+chartH-((nums[i]-minN)/range)*chartH*0.85;
    pts.push(px.toFixed(1)+','+py.toFixed(1));
  }
  var svg='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'">';
  svg+='<line x1="'+padL+'" y1="'+(padT+chartH*0.5)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH*0.5)+'" stroke="#f0f2f5" stroke-width="0.5"/>';
  svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#2980b9" stroke-width="2"/>';
  for(var i=0;i<nums.length;i++){
    var px=padL+(i+0.5)*(chartW/nums.length);
    var py=padT+chartH-((nums[i]-minN)/range)*chartH*0.85;
    svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="3" fill="#2980b9"/>';
    svg+='<text x="'+px.toFixed(1)+'" y="'+(py-7)+'" font-size="8" fill="#333" text-anchor="middle" font-weight="700">¥'+nums[i].toFixed(2)+'</text>';
    var yr=2026-nums.length+1+i;
    svg+='<text x="'+px.toFixed(1)+'" y="'+(h-6)+'" font-size="8" fill="#8b92a0" text-anchor="middle">'+String(yr).slice(2)+'</text>';
  }
  svg+='</svg>';
  var yoy=(nums[nums.length-1]-nums[nums.length-2])/nums[nums.length-2]*100;
  var yoyTxt=(yoy>=0?'📈 同比上涨':'📉 同比下跌')+Math.abs(yoy).toFixed(2)+'%';
  var yoyClr=yoy>=0?'var(--green)':'var(--red)';
  return svg+'<div style="margin-top:4px;text-align:center;font-size:11px;font-weight:700;color:'+yoyClr+'">'+yoyTxt+'</div>';
}

            '<div style="position:absolute;left:0;top:0;height:100%;width:'+pePos.toFixed(1)+'%;background:'+peClr+';opacity:0.6"></div>'+
            '<div style="position:absolute;left:'+pePos.toFixed(1)+'%;top:-3px;width:4px;height:16px;background:'+peClr+';border-radius:2px;transform:translateX(-50%)"></div>'+
          '</div>'+
          '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:2px"><span>0</span><span>15</span><span>30+</span></div>'+
        '</div>'+
        // PB
        '<div>'+
          '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:4px"><span style="color:var(--sub)">PB-MRQ <b style="color:var(--text)">'+pb.toFixed(2)+'</b></span><span style="color:'+pbClr+';font-weight:700">'+pbLvl+'</span></div>'+
          '<div style="height:10px;background:#eef0f4;border-radius:5px;position:relative;overflow:hidden">'+
            '<div style="position:absolute;left:0;top:0;height:100%;width:'+pbPos.toFixed(1)+'%;background:'+pbClr+';opacity:0.6"></div>'+
            '<div style="position:absolute;left:'+pbPos.toFixed(1)+'%;top:-3px;width:4px;height:16px;background:'+pbClr+';border-radius:2px;transform:translateX(-50%)"></div>'+
          '</div>'+
          '<div style="display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-top:2px"><span>0</span><span>2</span><span>4+</span></div>'+
        '</div>'+
      '</div>'+
      // 今日结论
      '<div style="background:'+overallClr+';color:#fff;padding:14px;border-radius:8px;text-align:center;margin-bottom:10px">'+
        '<div style="font-size:11px;opacity:0.85;margin-bottom:4px">今日结论</div>'+
        '<div style="font-size:22px;font-weight:800">'+overall+'</div>'+
        '<div style="font-size:11px;margin-top:4px;opacity:0.85">'+overallDesc+'</div>'+
      '</div>'+
      '<div style="font-size:9px;color:var(--sub);text-align:center;padding-bottom:4px">股息利差用当前实时数据计算 · PE/PB 来源东方财富 · 仅供研究参考，不构成投资建议</div>'+
    '</div>';
  }
  document.getElementById('monitor').innerHTML=mon;

  // 持仓页
  var totalMV=0,totalCost=0,totalPL=0,totalDiv=0;
  var opps='<div class="panel"><h2>📊 持仓管理</h2>';
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i],r=getStockData(c.code);
    var h=holdings[c.code]||{shares:0,cost:0};
    var sh=h.shares||0,costPer=h.cost||0;
    var mv=r.ok?sh*r.price:0,tc=costPer*sh;
    var pl=r.ok?mv-tc:0;
    var cdr=costPer>0?(c.div/costPer*100):0;
    var cdrClr=cdr>=6?'#2980b9':cdr>=5.5?'#27ae60':cdr>=5?'#b8860b':cdr>=4?'#d35400':cdr>0?'#c0392b':'var(--sub)';
    var annDiv=c.div*sh;
    var plClr=pl>0?'var(--red)':pl<0?'var(--green)':'var(--sub)';
    var liveDivR=r.ok?(c.div/r.price*100):0;
    var liveZone=divZone(liveDivR);
    totalMV+=mv;totalCost+=tc;totalPL+=pl;totalDiv+=annDiv;
    opps+='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px">'+
        '<div><span style="font-size:14px;font-weight:700">'+c.name+'</span> <span style="font-size:10px;color:var(--sub)">'+c.code+'</span></div>'+
        '<div style="text-align:right"><span style="font-size:14px;font-weight:700">¥'+(r.ok?r.price.toFixed(2):'—')+'</span> '+
        '<span style="font-size:11px;font-weight:700;color:'+liveZone.color+'">（'+liveZone.label+' '+liveDivR.toFixed(2)+'%）</span></div>'+
      '</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:4px;font-size:10px;text-align:center">'+
        '<div><div style="color:var(--sub);margin-bottom:2px">持股</div><div class="stepper" style="display:flex;justify-content:center"><button onclick="stpHolding(\''+c.code+'\',-100)" style="width:18px;height:18px;font-size:11px">−</button><input type="number" value="'+sh+'" step="100" min="0" onchange="onHoldingChange(\''+c.code+'\',this.value)" id="hs_'+c.code+'" style="width:42px;padding:1px 2px;font-size:11px"><button onclick="stpHolding(\''+c.code+'\',100)" style="width:18px;height:18px;font-size:11px">+</button></div></div>'+
        '<div><div style="color:var(--sub);margin-bottom:2px">成本/股</div><input type="number" value="'+(costPer||'')+'" step="0.001" placeholder="0" onchange="onCostChange(\''+c.code+'\',this.value)" style="width:55px;padding:2px;font-size:11px;text-align:center"></div>'+
        '<div><div style="color:var(--sub);margin-bottom:2px">股息率</div><div style="font-weight:700;color:'+cdrClr+'">'+(cdr>0?cdr.toFixed(2)+'%':'—')+'</div></div>'+
        '<div><div style="color:var(--sub);margin-bottom:2px">盈亏</div><div style="font-weight:700;color:'+plClr+'">'+(pl!==0?(pl>=0?'+':'')+Math.abs(pl).toFixed(0):'—')+'</div></div>'+
        '<div><div style="color:var(--sub);margin-bottom:2px">年分红</div><div style="font-weight:700;color:var(--orange)">¥'+Math.round(annDiv).toLocaleString()+'</div></div>'+
      '</div>'+
    '</div>';
  }
  var tplClr=totalPL>0?'var(--red)':totalPL<0?'var(--green)':'var(--sub)';
  var retRate=totalCost>0?(totalPL/totalCost*100):0;
  var divCostRate=totalCost>0?(totalDiv/totalCost*100):0;
  var retClr=retRate>=0?'var(--red)':'var(--green)';
  var divClr=divCostRate>=6?'#2980b9':divCostRate>=5.5?'#27ae60':divCostRate>=5?'#b8860b':divCostRate>=4?'#d35400':divCostRate>0?'#c0392b':'var(--sub)';
  opps+='<div style="background:#f8f9fa;border-radius:8px;padding:10px 12px;font-size:13px">'+
    '<div style="margin-bottom:6px"><span style="color:var(--sub);font-weight:400">总成本：</span><b>¥'+totalCost.toLocaleString()+'</b></div>'+
    '<div style="display:flex;justify-content:space-between;margin-bottom:6px"><div><span style="color:var(--sub);font-weight:400">浮动盈亏：</span><b style="color:'+tplClr+'">'+(totalPL>=0?'+':'')+totalPL.toFixed(0)+'</b></div><div style="text-align:right"><span style="color:var(--sub);font-weight:400">收益率：</span><b style="color:'+retClr+'">'+(retRate>=0?'+':'')+retRate.toFixed(2)+'%</b></div></div>'+
    '<div style="display:flex;justify-content:space-between"><div><span style="color:var(--sub);font-weight:400">年分红预估：</span><b style="color:var(--orange)">¥'+Math.round(totalDiv).toLocaleString()+'</b></div><div style="text-align:right"><span style="color:var(--sub);font-weight:400">成本股息率：</span><b style="color:'+divClr+'">'+divCostRate.toFixed(2)+'%</b></div></div>'+
  '</div></div>';
  document.getElementById('opp').innerHTML=opps;

  // 设置页
  var sett='<div class="panel"><h2>⚙️ 个股显示设置</h2>'+
    '<div style="font-size:11px;color:var(--sub);margin-bottom:12px">勾选的股票将显示在首页、个股、监控和持仓页中</div>';
  var cats={银行:[],保险:[],能源:[],消费:[]};
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i];
    if(!cats[c.cat])cats[c.cat]=[];
    cats[c.cat].push(c);
  }
  for(var cn in cats){
    sett+='<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)">'+cn+'</div>';
    for(var j=0;j<cats[cn].length;j++){
      var c=cats[cn][j],checked=enabledCodes[c.code]!==false?'checked':'';
      sett+='<label style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #f0f2f5;cursor:pointer">'+
        '<input type="checkbox" '+checked+' onchange="toggleStock(\''+c.code+'\',this.checked)" style="margin-right:10px;transform:scale(1.2)">'+
        '<span style="font-size:13px;font-weight:600">'+c.name+'</span><span style="font-size:10px;color:var(--sub);margin-left:6px">'+c.code+'</span>'+
        '<span style="margin-left:auto;font-size:10px;color:var(--sub)">¥'+c.div.toFixed(2)+'/股</span>'+
      '</label>';
    }
    sett+='</div>';
  }
  sett+='<div style="text-align:center;padding:10px;font-size:10px;color:var(--sub)">修改后所有页面即时生效。</div></div>';
  document.getElementById('settings').innerHTML=sett;

  // 恢复状态
  openIdx.forEach(function(idx){
    var el=document.querySelector('[data-idx="'+idx+'"] .acc-head');
    if(el){el.classList.add('open');var body=el.nextElementSibling;if(body)body.classList.add('show');}
  });
  if(activeTabId){
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
    var at=document.querySelector('.tabs button[data-tab="'+activeTabId+'"]');if(at)at.classList.add('on');
    ['dash','detail','monitor','opp','settings'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
    var e=document.getElementById(activeTabId);if(e)e.classList.remove('hidden');
  }
}

function onShareChange(code,val){shares[code]=parseInt(val)||0;try{localStorage.setItem('vc_shares',JSON.stringify(shares))}catch(e){}renderAll();}
function stpShare(code,delta){var v=(shares[code]||0)+delta;if(v<0)v=0;shares[code]=v;try{localStorage.setItem('vc_shares',JSON.stringify(shares))}catch(e){}renderAll();}
function onHoldingChange(code,val){var h=holdings[code]||{shares:0,cost:0};h.shares=parseInt(val)||0;holdings[code]=h;try{localStorage.setItem('vc_holdings',JSON.stringify(holdings))}catch(e){}renderAll();}
function stpHolding(code,delta){var h=holdings[code]||{shares:0,cost:0};h.shares=(h.shares||0)+delta;if(h.shares<0)h.shares=0;holdings[code]=h;try{localStorage.setItem('vc_holdings',JSON.stringify(holdings))}catch(e){}renderAll();}
function onCostChange(code,val){var h=holdings[code]||{shares:0,cost:0};h.cost=parseFloat(val)||0;holdings[code]=h;try{localStorage.setItem('vc_holdings',JSON.stringify(holdings))}catch(e){}renderAll();}
function toggleStock(code,checked){enabledCodes[code]=checked;try{localStorage.setItem('vc_enabled',JSON.stringify(enabledCodes))}catch(e){}renderAll();}
function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  ['dash','detail','monitor','opp','settings'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
  var e=document.getElementById(id);if(e)e.classList.remove('hidden');
}
function toggleAcc(el){var body=el.nextElementSibling;body.classList.toggle('show');el.classList.toggle('open');}
function openStockDetail(el){
  var code=el.getAttribute('data-code');
  var idx=-1;for(var i=0;i<data.length;i++)if(data[i].code===code){idx=i;break;}
  if(idx<0)return;
  var tabs=document.querySelectorAll('.tabs button');
  for(var i=0;i<tabs.length;i++){if(tabs[i].getAttribute('data-tab')==='detail'){switchTab(tabs[i],'detail');break;}}
  setTimeout(function(){
    var accItem=document.querySelector('[data-idx="'+idx+'"]');
    if(accItem){
      var head=accItem.querySelector('.acc-head'),body=accItem.querySelector('.acc-body');
      if(head&&body){head.classList.add('open');body.classList.add('show');accItem.scrollIntoView({behavior:'smooth',block:'start'});}
    }
  },100);
}

window.addEventListener('error',function(e){
  var t=document.getElementById('time');
  if(t)t.textContent='⚠️ '+e.message;
  console.error('error',e);
});
window.addEventListener('unhandledrejection',function(e){
  var t=document.getElementById('time');
  if(t)t.textContent='⚠️ 加载失败：'+(e.reason?(e.reason.message||e.reason):'');
  console.error('reject',e.reason);
});

load();
</script>
</body>
</html>
