<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>收息监控面板</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1a2e;--sub:#888;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#e67e22;--purple:#8e44ad;--border:#e8eaed;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px;max-width:800px;margin:0 auto}
header{text-align:center;padding:14px 0 10px}
header h1{font-size:20px;font-weight:800}header .time{font-size:11px;color:var(--sub);margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border-radius:10px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat .l{font-size:11px;color:var(--sub)}.stat .v{font-size:20px;font-weight:700;margin-top:4px}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border-left:4px solid var(--border)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card .name{font-size:16px;font-weight:700}.card .code{font-size:11px;color:var(--sub)}
.card .tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.tag-s{background:#e8f5e9;color:#27ae60}.tag-d{background:#fdebd0;color:#e67e22}
.tag-c{background:#eaf2f8;color:#2980b9}.tag-b{background:#f4ecf7;color:#8e44ad}
.card .target{text-align:right}.card .target .tl{font-size:10px;color:var(--sub)}.card .target .tv{font-size:13px;font-weight:700}
.price-line{display:flex;align-items:baseline;gap:10px}
.price{font-size:26px;font-weight:800}
.chg{font-size:13px;font-weight:600;padding:2px 8px;border-radius:4px;color:#fff}
.chg-up{background:var(--red)}.chg-down{background:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-top:8px;font-size:12px;color:var(--sub)}
.grid2 b{color:var(--text);font-weight:600}
.section{margin-top:16px}.section h2{font-size:15px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--card);border-radius:8px;padding:3px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:9px 4px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:none;color:var(--sub);transition:.15s}
.tabs button.on{background:var(--blue);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.row .r{font-size:11px;color:var(--sub)}
.bar{height:5px;border-radius:3px;background:#eee;width:80px}
.bar-fill{height:100%;border-radius:3px;transition:.3s}
.bar-hot{background:var(--red)}.bar-warm{background:var(--orange)}.bar-cool{background:var(--blue)}
.badge-hot{background:#ffeaea;color:var(--red);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-left:6px}
.btn-refresh{display:block;width:100%;padding:10px;margin:12px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue);transition:.2s}
.btn-refresh:active{opacity:.8}
footer{text-align:center;padding:12px;font-size:10px;color:var(--sub)}
.loading{text-align:center;padding:30px;color:var(--sub)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>📊 收息监控面板</h1><div class="time" id="time">点击下方按钮加载数据</div></header>
<div class="stats" id="stats"><div class="loading">⏳</div></div>
<div class="tabs">
  <button class="on" onclick="switchTab(this,'cards')">📋 概览</button>
  <button onclick="switchTab(this,'opp')">🎯 机会</button>
  <button onclick="switchTab(this,'div')">📅 分红</button>
</div>
<button class="btn-refresh" onclick="load()">🔄 刷新数据</button>
<div id="cards"></div>
<div id="opp" class="section hidden"></div>
<div id="div" class="section hidden"></div>
<footer>东方财富API · 点击刷新 · GitHub Pages</footer>

<script>
var CFG=[
  {name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,role:'周期弹性',tag:'tag-c',sh:1000},
  {name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,role:'稳定底仓',tag:'tag-s',sh:700},
  {name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,role:'高股息',tag:'tag-d',sh:500},
  {name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,role:'波动缓冲',tag:'tag-b',sh:0},
];
var DIV_CAL=[{s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:true},{s:'中国移动',t:'年报',d:'2026-09',p10:22},{s:'中国平安',t:'中报',d:'2026-10',p10:9.5},{s:'招商银行',t:'中报',d:'2027-01',p10:10}];

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2';
  var r=await fetch(u,{headers:{'Referer':'https://quote.eastmoney.com/'}});
  var j=await r.json();
  return j.data||{};
}

async function load(){
  document.getElementById('time').textContent='加载中...';
  var d=[];
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i];
    try{
      var raw=await fetchOne(c.mkt,c.code);
      var p=raw.f43||0,pc=raw.f60||0;
      d.push({
        name:c.name,code:c.code,role:c.role,tag:c.tag,sh:c.sh,div:c.div,buy:c.buy,
        price:p,prev:pc,
        chg:pc>0?((p-pc)/pc*100):0,
        hi:raw.f44||0,lo:raw.f45||0,op:raw.f46||0,
        pe:raw.f162||0,pb:raw.f167||0,
        mcap:(raw.f116||0)/1e8,
        divR:p>0?(c.div/p*100):0,
        dist:c.buy>0?((p-c.buy)/c.buy*100):0,
        ann:Math.round(c.sh*c.div),
      });
    }catch(e){d.push({name:c.name,code:c.code,err:true})}
  }
  render(d);
  document.getElementById('time').textContent='🟢 '+(new Date()).toLocaleString('zh-CN');
}

function render(d){
  var ad=0,ts=0;
  for(var i=0;i<d.length;i++){ad+=d[i].ann||0;ts+=d[i].sh||0}
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="l">年分红预估</div><div class="v">¥'+ad.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">月均现金流</div><div class="v">¥'+(ad/12).toFixed(0)+'</div></div>';

  document.getElementById('cards').innerHTML=d.map(function(r){
    if(r.err)return'<div class="card"><div class="name">'+r.name+'</div>接口异常</div>';
    var up=r.chg>0,dc=r.dist<=5?'#27ae60':'#e67e22';
    return'<div class="card" style="border-left-color:'+(r.name==='招商银行'?'#27ae60':r.name==='格力电器'?'#e67e22':r.name==='中国平安'?'#2980b9':'#8e44ad')+'">'+
      '<div class="card-top">'+
        '<div><div class="name">'+r.name+'<span class="code"> '+r.code+'</span></div><span class="tag '+r.tag+'">'+r.role+'</span></div>'+
        (r.buy?'<div class="target"><div class="tl">补仓≤¥'+r.buy+'</div><div class="tv" style="color:'+dc+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</div></div>':'')+
      '</div>'+
      '<div class="price-line"><span class="price">'+r.price.toFixed(2)+'</span><span class="chg '+(up?'chg-up':'chg-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      '<div class="grid2">'+
        '<div>PE <b>'+r.pe.toFixed(1)+'</b></div><div>PB <b>'+r.pb.toFixed(2)+'</b></div>'+
        '<div>股息率 <b style="color:#e67e22">'+r.divR.toFixed(2)+'%</b></div><div>市值 <b>'+r.mcap.toFixed(0)+'亿</b></div>'+
        '<div>最高 <b style="color:#e74c3c">'+r.hi.toFixed(2)+'</b></div><div>最低 <b style="color:#27ae60">'+r.lo.toFixed(2)+'</b></div>'+
        '<div>昨收 <b>'+r.prev.toFixed(2)+'</b></div><div>今开 <b>'+r.op.toFixed(2)+'</b></div>'+
      '</div>'+
      (r.sh>0?'<div style="font-size:11px;color:var(--sub);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)">'+r.sh+' 股 × ¥'+r.div+' ≈ 年分红 ¥'+r.ann+'</div>':'')+
    '</div>';
  }).join('');

  document.getElementById('opp').innerHTML='<h2>🎯 买入机会排行（距补仓价）</h2>'+
    d.filter(function(r){return r.buy>0}).sort(function(a,b){return a.dist-b.dist}).map(function(r,i){
      var w=Math.max(5,100-Math.abs(r.dist)*10),c=r.dist<=3?'bar-hot':r.dist<=7?'bar-warm':'bar-cool';
      return'<div class="row"><span>'+(i+1)+'. <b>'+r.name+'</b></span><span class="r">¥'+r.price.toFixed(2)+' → ¥'+r.buy+'</span>'+
        '<span style="font-weight:700;color:'+(r.dist<=5?'#27ae60':'#e67e22')+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</span>'+
        '<div class="bar"><div class="bar-fill '+c+'" style="width:'+w+'%"></div></div></div>';
    }).join('');

  document.getElementById('div').innerHTML='<h2>📅 分红日历</h2>'+
    DIV_CAL.map(function(e){
      return'<div class="row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span class="r">'+e.d+'</span>'+
        '<span>10派'+e.p10+'元</span>'+(e.hot?'<span class="badge-hot">本月</span>':'')+'</div>';
    }).join('');
}

function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  document.querySelectorAll('#opp,#div,#cards').forEach(function(e){e.classList.add('hidden')});
  if(id==='cards')document.getElementById('cards').classList.remove('hidden');
  else document.getElementById(id).classList.remove('hidden');
}

load();
</script>
</body>
</html>
