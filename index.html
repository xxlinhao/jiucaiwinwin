<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>韭菜WinWin</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--border:#e4e7ed;--text:#1d1d2e;--sub:#8b92a0;--red:#e74c3c;--orange:#f39c12;--yellow:#f1c40f;--green:#27ae60;--blue:#2980b9;--purple:#8e44ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto}
header{padding:14px 0 8px;text-align:center}
header h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
header .st{font-size:10px;color:var(--sub);margin-top:1px}
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;margin:8px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--sub);cursor:pointer}
.refresh-bar:active{opacity:.7}

/* ═══ 首页卡片 ═══ */
.dash-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:8px;box-shadow:0 1px 2px rgba(0,0,0,.03);position:relative}
.dash-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.dash-card.green::before{background:var(--green)}
.dash-card.yellow::before{background:var(--yellow)}
.dash-card.orange::before{background:var(--orange)}
.dash-card.red::before{background:var(--red)}
.dash-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.dash-name{font-size:15px;font-weight:700}.dash-code{font-size:11px;color:var(--sub)}
.dash-advice{font-size:12px;font-weight:700;padding:4px 12px;border-radius:6px}
.advice-buy{background:#e8f5e9;color:#1e8449}.advice-wait{background:#fff8e0;color:#b8860b}.advice-nop{background:#f0f2f5;color:var(--sub)}
.dash-price{font-size:26px;font-weight:800;margin-bottom:6px}
.dash-price .dash-chg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;margin-left:8px}
.dash-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;padding:4px 0}
.dash-row .k{color:var(--sub)}.dash-row .kv{font-weight:600}
.dash-bar{height:4px;background:#f0f2f5;border-radius:2px;margin-top:4px;position:relative}
.dash-bar .fill{height:100%;border-radius:2px;transition:.3s}
.dash-bar .dot{position:absolute;width:8px;height:8px;border-radius:50%;top:-2px;transform:translateX(-50%);border:1px solid #fff}
.dash-est{font-size:10px;color:var(--sub);margin-top:4px;text-align:right}

/* ═══ Tab ═══ */
.tabs{display:flex;gap:3px;margin-bottom:10px}
.tabs button{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card);color:var(--sub)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}

/* ═══ 个股详情（折叠面板） ═══ */
.acc-item{border-bottom:1px solid var(--border)}
.acc-head{cursor:pointer;padding:14px 4px;display:flex;align-items:center;justify-content:space-between}
.acc-head .name{font-size:15px;font-weight:700;flex:1}
.acc-head .price{font-size:18px;font-weight:800;margin:0 10px}
.acc-head .chg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:50px;text-align:center}
.chg-up{background:#fde8e8;color:var(--red)}.chg-down{background:#e8f5e9;color:var(--green)}
.acc-head .arrow{font-size:14px;color:var(--sub);transition:.3s;min-width:20px;text-align:right}
.acc-head.open .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 4px 16px}
.acc-body.show{display:block}
/* 折线柱状组合图 */
.trend-svg{width:100%;height:90px;margin-top:6px;display:block}
.trend-legend{font-size:9px;color:var(--sub);margin-top:4px}
.trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.dl-section{margin-bottom:10px}
.dl-section h4{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid #f0f2f5}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px}
.mgrid .m{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid #f8f9fb}
.m .k{color:var(--sub)}.m .kv{font-weight:600}
/* 营收利润条 */
.trend-bars{display:flex;align-items:flex-end;gap:6px;height:80px;margin-top:4px;padding:0 4px}
.trend-bar{flex:1;text-align:center;font-size:8px;color:var(--sub)}
.trend-bar .rev{width:100%;border-radius:3px 3px 0 0;background:linear-gradient(#2980b9,#58a6ff);min-height:2px}
.trend-bar .np{width:65%;margin:1px auto 0;border-radius:3px 3px 0 0;background:linear-gradient(#e67e22,#f0a040);min-height:2px}
.trend-bar .yr{font-size:9px;margin-top:2px}
/* 股息率节点表（横向） */
.div-table{width:100%;border-collapse:collapse;font-size:10px;margin:6px 0;table-layout:fixed}
.div-table th{font-size:9px;color:var(--sub);font-weight:400;padding:4px 2px;border-bottom:1px solid #f0f2f5;text-align:center}
.div-table td{padding:6px 2px;text-align:center;border-bottom:1px solid #f8f9fb;font-size:11px}
.div-table .col-rate{color:var(--sub);font-size:9px}
.div-table .col-price{font-weight:600}
.div-table tr.current td{background:#fff0f0;font-weight:700;color:var(--red)}
/* 目标价横向条 */
/* 分段目标价条（SVG） */
.divseg-svg{width:100%;display:block;margin:10px 0}
.hist{display:flex;gap:3px;font-size:10px;color:var(--sub);flex-wrap:wrap}
.hist span{background:#f0f2f5;padding:2px 5px;border-radius:3px}
.dates-row{display:flex;gap:12px;font-size:11px;color:var(--sub);padding:4px 0}

/* ═══ 模拟器/机会/日历 ═══ */
.sim-header{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.sim-box{background:linear-gradient(135deg,#e8f0fe,#f3e5f5);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center}
.sim-box .num{font-size:24px;font-weight:800}.sim-box .lb{font-size:10px;color:var(--sub);margin-top:2px}
.sim-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.sim-row input{width:50px;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--bg);text-align:center;font-size:13px;font-weight:600}
.sim-row .out{font-weight:700;color:var(--orange);min-width:50px;text-align:right}
.cal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.cal-row .hot{background:#fde8e8;color:var(--red);padding:1px 7px;border-radius:4px;font-size:9px;font-weight:600}
.opp-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.opp-stars{color:#f1c40f;font-size:10px;letter-spacing:2px;margin-left:4px}
.section-title{font-size:13px;font-weight:700;margin-bottom:8px;color:var(--text)}
.hidden{display:none}
footer{text-align:center;padding:16px;font-size:10px;color:var(--sub)}
</style>
</head>
<body>
<header><h1>🥬 韭菜WinWin</h1><div class="st">股息率价值投资 · 今日判断</div></header>
<div class="refresh-bar" onclick="load()"><span id="time">点击刷新数据</span> 🔄</div>
<div class="tabs">
  <button class="on" data-tab="dash" onclick="switchTab(this,'dash')">🏠 首页</button>
  <button data-tab="detail" onclick="switchTab(this,'detail')">🔍 个股</button>
  <button data-tab="divcenter" onclick="switchTab(this,'divcenter')">💰 分红中心</button>
  <button data-tab="opp" onclick="switchTab(this,'opp')">⭐ 机会</button>
</div>
<div id="dash"></div><div id="detail" class="hidden"></div><div id="divcenter" class="hidden"></div><div id="opp" class="hidden"></div>
<footer>东方财富API · 价值投资观察站</footer>

<script>
var shares={};
try{shares=JSON.parse(localStorage.getItem('vc_shares')||'{}');}catch(e){shares={};}

var CFG=[
{name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,tag:'tg-c',role:'周期弹性',roe:12.5,divHist:['2.50','2.55','2.55','2.55','2.70'],earn:'2026-08-28',divDt:'2026-10-20'},
{name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,tag:'tg-s',role:'稳定底仓',roe:14.8,divHist:['1.52','1.74','1.97','2.00','2.02'],earn:'2026-08-22',divDt:'2027-01-15'},
{name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,tag:'tg-d',role:'高股息',roe:18.2,divHist:['3.00','2.00','3.38','3.00','3.00'],earn:'2026-08-18',divDt:'2026-08-28'},
{name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,tag:'tg-b',role:'波动缓冲',roe:10.5,divHist:['2.09','3.87','4.41','4.56','4.70'],earn:'2026-08-15',divDt:'2026-09-10'},
];
var DIV_CAL=[
{s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:1},
{s:'中国移动',t:'年报',d:'2026-09',p10:22},
{s:'中国平安',t:'中报',d:'2026-10',p10:9.5},
{s:'招商银行',t:'中报',d:'2027-01',p10:10},
];
var data=[];

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2';
  try{var r=await fetch(u);if(r.ok){var j=await r.json();if(j&&j.data)return j.data}}catch(e){}
  return{};
}

function getAnn(code){var s=shares[code]||0;for(var i=0;i<CFG.length;i++)if(CFG[i].code===code)return s*CFG[i].div;return 0}
function calcTotal(func){var t=0;for(var i=0;i<CFG.length;i++)t+=func(CFG[i].code);return t}

function divLevel(divR){if(divR<5)return'red';if(divR<5.3)return'orange';if(divR<5.5)return'yellow';return'green'}
function divColor(divR){if(divR<5)return'var(--red)';if(divR<5.3)return'var(--orange)';if(divR<5.5)return'var(--yellow)';return'var(--green)'}
function divBarPct(divR){if(divR<=4)return 0;if(divR>=6)return 100;return(divR-4)/2*100}
function advice(dist,divR){
  if(dist<0)return{text:'✅ 加仓',cls:'advice-buy'};
  if(dist<=3&&divR>=5.3)return{text:'👀 等回踩',cls:'advice-wait'};
  if(dist<=7&&divR>=5)return{text:'⏳ 观察',cls:'advice-wait'};
  return{text:'🚫 不操作',cls:'advice-nop'};
}

async function load(){
  document.getElementById('time').textContent='⏳ 加载中...';
  for(var i=0;i<CFG.length;i++){if(typeof shares[CFG[i].code]==='undefined')shares[CFG[i].code]=0;}
  data=[];
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i];
    var row={name:c.name,code:c.code,role:c.role,tag:c.tag,div:c.div,buy:c.buy,roe:c.roe,divHist:c.divHist,earn:c.earn,divDt:c.divDt,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false};
    try{
      var raw=await fetchOne(c.mkt,c.code);
      if(raw&&raw.f43){
        row.price=raw.f43;row.prev=raw.f60||0;
        row.chg=row.prev>0?((row.price-row.prev)/row.prev*100):0;
        row.pe=raw.f162||0;row.pb=raw.f167||0;
        row.mcap=(raw.f116||0)/1e8;
        row.divR=c.div/row.price*100;
        row.dist=(row.price-c.buy)/c.buy*100;
        row.needy=c.buy-row.price;
        row.ok=true;
      }
    }catch(e){}
    data.push(row);
  }
  renderAll();
  document.getElementById('time').textContent='🟢 '+new Date().toLocaleTimeString('zh-CN');
}

function renderAll(){
  // 记录当前打开的面板和当前 tab，重渲染后恢复
  var openIdx=[];
  document.querySelectorAll('.acc-head.open').forEach(function(el){
    var idx=parseInt(el.parentNode.getAttribute('data-idx')||-1);
    if(idx>=0)openIdx.push(idx);
  });
  var activeTab=document.querySelector('.tabs button.on');
  var activeTabId=activeTab?activeTab.getAttribute('data-tab'):'dash';
  // ═══ 首页 ═══
  var dash=[];var ann=Math.round(calcTotal(getAnn));
  dash.push('<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--sub)">年分红预估</div><div style="font-size:22px;font-weight:800">¥'+ann.toLocaleString()+'</div></div>'+
    '<div style="background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center"><div style="font-size:10px;color:var(--sub)">月均现金流</div><div style="font-size:22px;font-weight:800">¥'+Math.round(ann/12).toLocaleString()+'</div></div></div>');
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){dash.push('<div class="dash-card"><div class="dash-name">'+r.name+'</div><div style="font-size:11px;color:var(--sub)">加载中...</div></div>');continue;}
    var up=r.chg>0;var lvl=divLevel(r.divR);var clr=divColor(r.divR);
    var adv=advice(r.dist,r.divR);
    var nudge='';if(r.needy>0)nudge='距补仓还需跌¥'+r.needy.toFixed(2);else if(r.needy===0)nudge='已达到目标价！';else nudge='低于目标¥'+Math.abs(r.needy).toFixed(2)+' ✅';
    var pct=divBarPct(r.divR);
    dash.push('<div class="dash-card '+lvl+'"><div class="dash-top"><div><span class="dash-name">'+r.name+'</span><span class="dash-code"> '+r.code+'</span></div><span class="dash-advice '+adv.cls+'">'+adv.text+'</span></div>'+
      '<div class="dash-price">¥'+r.price.toFixed(2)+'<span class="dash-chg '+(up?'dl-chg-up':'dl-chg-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      '<div class="dash-row"><span class="k">股息率</span><span class="kv" style="color:'+clr+'">'+r.divR.toFixed(2)+'%</span></div>'+
      '<div class="dash-row"><span class="k">距目标价</span><span class="kv" style="color:'+(r.dist<=5?'var(--green)':'var(--orange)')+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</span></div>'+
      '<div class="dash-bar"><div class="fill" style="width:'+pct+'%;background:'+clr+'"></div><div class="dot" style="left:'+pct+'%;background:'+clr+'"></div></div>'+
      '<div class="dash-est">'+nudge+' · 年分红预估 ¥'+Math.round(getAnn(r.code))+'</div></div>');
  }
  document.getElementById('dash').innerHTML=dash.join('');

  // ═══ 个股详情（折叠面板） ═══
  var detail=[];
  var sel='<div style="margin-bottom:12px;font-size:11px;color:var(--sub)">点击股票行展开查看详细数据</div>';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){detail.push('<div class="acc-item" data-idx="'+i+'"><div class="acc-head"><span class="name">'+r.name+'</span><span style="font-size:11px;color:var(--sub)">加载中...</span><span class="arrow">▼</span></div></div>');continue;}
    var up=r.chg>0;var lvl=divLevel(r.divR);var clr=divColor(r.divR);
    var pct=divBarPct(r.divR);
    // 股息率节点表（横向布局，公式：股价 = 每股分红 / 股息率）
    var nodes=[6,5.5,5.3,5,4.5,4];
    var nodeRows='<tr style="background:#f8f9fb"><td class="col-rate">股息率</td><td class="col-rate">对应股价</td><td class="col-rate">差值</td></tr>';
    for(var ni=0;ni<nodes.length;ni++){
      var np=Math.round(r.div/(nodes[ni]/100)*100)/100;
      var diff=r.price-np;
      var isCur=Math.abs(diff)<0.5;
      nodeRows+='<tr'+(isCur?' class="current"':'')+'><td class="col-rate">'+nodes[ni].toFixed(1)+'%</td><td class="col-price">¥'+np.toFixed(2)+'</td><td>'+(diff>=0?'+':'')+diff.toFixed(2)+'</td></tr>';
    }
    // 分段股息率条（节点对应股价，价格从低到高）
    var rateNodes=[{rate:6,color:'#d0f0d8',color2:'#27ae60'},{rate:5.5,color:'#c8eccf',color2:'#27ae60'},{rate:5.3,color:'#e8f5e0',color2:'#7fb069'},{rate:5,color:'#fff8d0',color2:'#e5b800'},{rate:4.5,color:'#ffe0c0',color2:'#e67e22'},{rate:4,color:'#fde8e8',color2:'#e74c3c'}];
    // 边界价格：rate=6 对应价格最小，rate=4 对应价格最大
    var priceBound=[];for(var kk=0;kk<rateNodes.length;kk++)priceBound.push(r.div/(rateNodes[kk].rate/100));
    priceBound.sort(function(a,b){return a-b;});
    var pMin=priceBound[0],pMax=priceBound[priceBound.length-1];
    var segHTML='';
    // 单个 SVG 把整个分段条、刻度、标签、当前价位置都画出来
    // 横轴按价格等距：rate=6 → 最小价(左)，rate=4 → 最大价(右)
    function pos(price){return Math.max(1,Math.min(99,(price-axesMin)/(axesMax-axesMin)*100))}
    var rateVals=[6,5.5,5.3,5,4.5,4];
    var axesMin=r.div/0.07;
    var axesMax=r.div/0.035;
    var segH=26,segTop=26,segBottom=52,svgH=100;
    var labelTop=segBottom+12,labelBottom=labelTop+12;
    segHTML+='<svg class="divseg-svg" viewBox="0 0 400 '+svgH+'">';
    var segColors=['#d0f0d8','#c8eccf','#e8f5e0','#fff8d0','#ffe0c0','#fde8e8'];
    var txtColors=['#27ae60','#27ae60','#7fb069','#e5b800','#e67e22','#e74c3c'];
    for(var kk=0;kk<6;kk++){
      var leftP=pos(r.div/(rateVals[kk]/100));
      var rightP=kk<5?pos(r.div/(rateVals[kk+1]/100)):99;
      var segX=leftP, segW=Math.max(2,rightP-segX);
      segHTML+='<rect x="'+segX.toFixed(2)+'%" y="'+segTop+'" width="'+segW.toFixed(2)+'%" height="'+segH+'" fill="'+segColors[kk]+'" rx="3"/>';
    }
    for(var kk=0;kk<6;kk++){
      var tickX=pos(r.div/(rateVals[kk]/100));
      segHTML+='<line x1="'+tickX.toFixed(2)+'%" y1="'+(segTop-3)+'" x2="'+tickX.toFixed(2)+'%" y2="'+(segBottom+3)+'" stroke="'+txtColors[kk]+'" stroke-width="1.2"/>';
      segHTML+='<text x="'+tickX.toFixed(2)+'%" y="'+labelTop+'" font-size="11" font-weight="700" fill="'+txtColors[kk]+'" text-anchor="middle">'+rateVals[kk].toFixed(1)+'%</text>';
      segHTML+='<text x="'+tickX.toFixed(2)+'%" y="'+labelBottom+'" font-size="10" fill="#8b92a0" text-anchor="middle">'+(r.div/(rateVals[kk]/100)).toFixed(1)+'</text>';
    }
    var curPct=pos(r.price);
    var lbW=7,lbH=14;
    var lbX=Math.max(2,Math.min(100-lbW,curPct-lbW/2));
    segHTML+='<polygon points="'+(curPct-1.2)+'%,16 '+(curPct+1.2)+'%,16 '+curPct.toFixed(2)+'%,22" fill="#e74c3c"/>';
    segHTML+='<rect x="'+lbX.toFixed(2)+'%" y="2" width="'+lbW.toFixed(2)+'%" height="'+lbH+'" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="1.5"/>';
    segHTML+='<text x="'+((lbX+lbW/2)).toFixed(2)+'%" y="12" font-size="10" font-weight="800" fill="#e74c3c" text-anchor="middle">'+r.price.toFixed(2)+'</text>';
    segHTML+='<line x1="'+curPct.toFixed(2)+'%" y1="22" x2="'+curPct.toFixed(2)+'%" y2="'+(segTop-1)+'" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="2,3"/>';
    segHTML+='</svg>';
    // 营收/利润
    var rev=null,np=null;
    if(r.code==='600036'){rev=[3313,3448,3391,3375,3300];np=[1200,1380,1466,1484,1502];}
    else if(r.code==='000651'){rev=[1897,1902,2050,1900,1711];np=[231,245,290,322,290];}
    else if(r.code==='601318'){rev=[11800,12200,9700,10300,11400];np=[1016,838,857,1267,1520];}
    else if(r.code==='600941'){rev=[8483,9373,10093,10408,10502];np=[1159,1255,1318,1384,1502];}
    var bars='';
    if(rev&&np){
      var rMax=Math.max.apply(null,rev),nMax=Math.max.apply(null,np);
      var yrs=['21','22','23','24','25'];
      // SVG 柱状+折线 组合图
      var w=320,h=80,padL=30,padR=8,padT=6,padB=18;
      var chartW=w-padL-padR,chartH=h-padT-padB;
      var barW=chartW/5*0.55;
      var svg='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none">';
      // 背景网格
      var yMid=padT+chartH*0.6;
      svg+='<line x1="'+padL+'" y1="'+yMid+'" x2="'+(w-padR)+'" y2="'+yMid+'" stroke="#f0f2f5" stroke-width="0.5"/>';
      // 柱状（营收）
      for(var bi=0;bi<5;bi++){
        var bx=padL+(bi+0.5)*(chartW/5)-barW/2;
        var bh=Math.max(2,(rev[bi]/rMax)*chartH);
        svg+='<rect x="'+bx.toFixed(1)+'" y="'+(padT+chartH-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="#2980b9" rx="2"/>';
      }
      // 折线（净利）
      var pts=[];
      for(var bi=0;bi<5;bi++){
        var px=padL+(bi+0.5)*(chartW/5);
        var py=padT+chartH-(np[bi]/nMax)*chartH*0.7;
        pts.push(px+','+py);
      }
      svg+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#e67e22" stroke-width="2"/>';
      for(var bi=0;bi<5;bi++){
        var px=padL+(bi+0.5)*(chartW/5);
        var py=padT+chartH-(np[bi]/nMax)*chartH*0.7;
        var cl=(np[bi]<0?'#e74c3c':'#e67e22');
        var r=(np[bi]<0?5:3);
        if(np[bi]<0)svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="5" fill="none" stroke="#e74c3c" stroke-width="2"/>';
        svg+='<circle cx="'+px.toFixed(1)+'" cy="'+py.toFixed(1)+'" r="'+r+'" fill="'+cl+'"/>';
        var vStr=np[bi]>=10000?(np[bi]/10000).toFixed(1)+'万':String(np[bi]);
        svg+='<text x="'+px.toFixed(1)+'" y="'+(py-8)+'" font-size="8" fill="'+cl+'" text-anchor="middle" font-weight="700">'+vStr+'</text>';
      }
      // 营收柱上标数值
      var barW2=chartW/5*0.55;
      for(var bi=0;bi<5;bi++){
        var bx2=padL+(bi+0.5)*(chartW/5)-barW2/2;
        var bh2=Math.max(2,(rev[bi]/rMax)*chartH);
        var revStr=rev[bi]>=10000?(rev[bi]/10000).toFixed(1)+'万':String(rev[bi]);
        svg+='<text x="'+(bx2+barW2/2).toFixed(1)+'" y="'+(padT+chartH-bh2-3)+'" font-size="7.5" fill="#2980b9" text-anchor="middle" font-weight="600">'+revStr+'</text>';
      }
      // 年份标签
      for(var bi=0;bi<5;bi++){
        var lx=padL+(bi+0.5)*(chartW/5);
        svg+='<text x="'+lx.toFixed(1)+'" y="'+(h-4)+'" font-size="9" fill="#8b92a0" text-anchor="middle">'+yrs[bi]+'</text>';
      }
      svg+='</svg>';
      bars=svg;
    }
    // 分红历史
    var histStr='';var hist=r.divHist||[];for(var j=0;j<hist.length;j++)histStr+='<span>'+(j?'→ ':'')+'¥'+hist[j]+'</span>';
    // needy = buy - price，正值=当前价低于补仓价(好)，负值=当前价高于补仓价(贵)
    var nudge='';if(r.needy>0)nudge='低于补仓价 ¥'+r.needy.toFixed(2)+' ✅ 可加仓';else if(r.needy<0)nudge='高于补仓价 ¥'+Math.abs(r.needy).toFixed(2);else nudge='等于补仓价';
    var adviceStr=r.needy>0?'已进入补仓区':r.dist<=5?'接近目标':'观望';

    detail.push(
'<div class="acc-item" data-idx="'+i+'"><div class="acc-head" onclick="toggleAcc(this)"><span class="name"><span style="font-size:12px;font-weight:400;color:var(--sub);margin-right:4px">'+(i+1)+'</span>'+r.name+'</span><span class="price">¥'+r.price.toFixed(2)+'</span><span class="chg '+(up?'chg-up':'chg-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span><span class="arrow">▼</span></div>'+
'<div class="acc-body">'+
  '<div class="dl-section"><h4>📈 估值与业绩趋势</h4><div class="mgrid"><div class="m"><span class="k">PE</span><span class="kv">'+r.pe.toFixed(1)+'</span></div><div class="m"><span class="k">PB</span><span class="kv">'+r.pb.toFixed(2)+'</span></div><div class="m"><span class="k">ROE</span><span class="kv">'+r.roe.toFixed(1)+'%</span></div><div class="m"><span class="k">市值</span><span class="kv">'+r.mcap.toFixed(0)+'亿</span></div></div>'+
  (bars?'<div style="font-size:10px;color:var(--sub);margin-top:6px"><span style="color:#2980b9">■ 营收</span> <span style="color:#e67e22;margin-left:8px">■ 净利</span>（亿元）</div><div class="trend-bars">'+bars+'</div>':'')+'</div>'+
  '<div class="dl-section"><h4>💵 近五年每股分红</h4><div class="hist">'+histStr+'</div></div>'+
  '<div class="dl-section"><h4>🎯 目标价分段（股息率节点）</h4><div style="font-size:10px;color:var(--sub);margin-bottom:4px">'+nudge+' · '+adviceStr+'</div>'+segHTML+'</div>'+
  '<div class="dl-section"><h4>📅 事件提醒</h4><div class="dates-row"><span>📊 财报：'+(r.earn||'—')+'</span><span>💵 分红：'+(r.divDt||'—')+'</span></div></div>'+
'</div></div>'
    );
  }
  document.getElementById('detail').innerHTML=sel+detail.join('');

  // ═══ 分红中心 ═══
  var divs=[];
  divs.push('<div class="sim-header"><div class="sim-box"><div class="num">¥'+ann.toLocaleString()+'</div><div class="lb">预计年分红</div></div><div class="sim-box"><div class="num">¥'+Math.round(ann/12).toLocaleString()+'</div><div class="lb">月均现金流</div></div></div>');
  divs.push('<div class="section-title">📝 分红模拟器</div><div style="font-size:10px;color:var(--sub);margin-bottom:8px">输入持股数，实时计算年度分红</div>');
  for(var i=0;i<data.length;i++){var r=data[i];if(!r.ok)continue;divs.push('<div class="sim-row"><span style="font-weight:600;min-width:60px">'+r.name+'</span><span style="color:var(--sub);font-size:10px">股</span><input type="number" value="'+(shares[r.code]||0)+'" min="0" onchange="onShareChange(\''+r.code+'\',this.value)" id="i_'+r.code+'"><span class="out" id="o_'+r.code+'">¥'+Math.round(getAnn(r.code))+'</span></div>')}
  divs.push('<div class="section-title" style="margin-top:16px">📅 下次分红日历</div>');
  for(var i=0;i<DIV_CAL.length;i++){var e=DIV_CAL[i];divs.push('<div class="cal-row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span style="color:var(--sub)">'+e.d+'</span><span>10派¥'+e.p10+'</span>'+(e.hot?'<span class="hot">本月</span>':'')+'</div>')}
  document.getElementById('divcenter').innerHTML=divs.join('');

  // ═══ 机会排行 ═══
  var opps=[];var sorted=data.slice().filter(function(r){return r.buy>0&&r.ok;}).sort(function(a,b){return a.dist-b.dist;});
  opps.push('<div class="section-title">⭐ 下次机会在哪里？</div><div style="font-size:10px;color:var(--sub);margin-bottom:8px">按距目标补仓价排序，越近机会越大</div>');
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];var stars='';var sc=r.dist<=0?5:r.dist<=3?4:r.dist<=5?3:r.dist<=8?2:1;
    for(var s=0;s<5;s++)stars+=s<sc?'★':'☆';
    var clr=r.dist<=5?'var(--green)':'var(--orange)';
    var needStr=r.needy>0?('需跌 ¥'+r.needy.toFixed(2)):'已在补仓区';
    opps.push('<div class="opp-card"><span style="font-weight:700;min-width:24px">'+(i+1)+'.</span><div><div style="font-size:12px;font-weight:600">'+r.name+'</div><div style="font-size:10px;color:var(--sub)">¥'+r.price.toFixed(2)+' → ¥'+r.buy+' · '+needStr+'</div></div><div style="text-align:right"><div class="opp-stars">'+stars+'</div><div style="font-size:11px;font-weight:700;color:'+clr+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</div></div></div>');
  }
  document.getElementById('opp').innerHTML=opps.join('')||'<div style="text-align:center;padding:20px;color:var(--sub)">暂无数据</div>';

  // 恢复展开状态
  openIdx.forEach(function(idx){
    var el=document.querySelector('[data-idx="'+idx+'"] .acc-head');
    if(el){el.classList.add('open');var body=el.nextElementSibling;if(body)body.classList.add('show');}
  });
  // 恢复tab
  if(activeTabId){
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
    var at=document.querySelector('.tabs button[data-tab="'+activeTabId+'"]');if(at)at.classList.add('on');
    ['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
    var e=document.getElementById(activeTabId);if(e)e.classList.remove('hidden');
  }
}

function onShareChange(code,val){shares[code]=parseInt(val)||0;try{localStorage.setItem('vc_shares',JSON.stringify(shares))}catch(e){}document.getElementById('o_'+code).textContent='¥'+Math.round(getAnn(code));var ann=Math.round(calcTotal(getAnn));var totalEl=document.getElementById('simT');if(totalEl)totalEl.textContent='¥'+ann.toLocaleString()}

function switchTab(btn,id){document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});btn.classList.add('on');['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});var e=document.getElementById(id);if(e)e.classList.remove('hidden')}
function toggleAcc(el){var body=el.nextElementSibling;body.classList.toggle('show');el.classList.toggle('open')}

load();
setInterval(load,60000);
</script>
</body>
</html>
