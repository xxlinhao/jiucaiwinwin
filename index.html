<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>韭菜WinWin</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--border:#e4e7ed;--text:#1d1d2e;--sub:#8b92a0;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#f39c12;--yellow:#f1c40f;--purple:#8e44ad}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{padding:14px 0 8px;text-align:center}
header h1{font-size:18px;font-weight:800;letter-spacing:-.4px}
header .st{font-size:10px;color:var(--sub);margin-top:1px}
.refresh-bar{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px;margin:8px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--sub);cursor:pointer}
.tabs{display:flex;gap:3px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card);color:var(--sub)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.sts{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.st{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.st .l{font-size:10px;color:var(--sub)}
.st .v{font-size:20px;font-weight:800;margin-top:3px}
.dc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;position:relative}
.dc::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;border-radius:2px 0 0 2px}
.dc.safe::before{background:var(--green)}
.dc.warn::before{background:var(--orange)}
.dc.danger::before{background:var(--red)}
.dc.yellow::before{background:var(--yellow)}
.dc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.dc-top .name{font-size:15px;font-weight:700}
.dc-top .code{font-size:11px;color:var(--sub);margin-left:4px}
.dc-p{font-size:24px;font-weight:800}
.chip{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;color:#fff}
.chip-up{background:#fde8e8;color:var(--red)}
.chip-down{background:#e8f5e9;color:var(--green)}
.tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600}
.tag-s{background:#e8f5e9;color:#27ae60}
.tag-d{background:#fff3e0;color:#e67e22}
.tag-c{background:#e8f0fe;color:#2980b9}
.tag-b{background:#f3e5f5;color:#8e44ad}
.adv{font-size:11px;font-weight:700;padding:3px 8px;border-radius:5px}
.a-buy{background:#e8f5e9;color:#1e8449}
.a-wait{background:#fff8e0;color:#b8860b}
.a-nop{background:#f0f2f5;color:var(--sub)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.m{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid #f8f9fb}
.m .k{color:var(--sub)}.m .v{font-weight:600}
.bar-track{height:6px;background:#eef0f4;border-radius:3px;position:relative;margin-top:4px}
.bar-fill{height:100%;border-radius:3px;transition:.3s}
.bar-dot{position:absolute;width:10px;height:10px;border-radius:50%;top:-2px;transform:translateX(-50%);border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bar-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-bottom:3px}
.zone-tags{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.zt{font-size:9px;padding:2px 6px;border-radius:3px;font-weight:600}
.zt-r{background:#fde8e8;color:#c0392b}.zt-o{background:#ffe6d0;color:#d35400}
.zt-y{background:#fff9e0;color:#b8860b}.zt-g{background:#e8f5e9;color:#1e8449}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.panel h2{font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.acc-item{border-bottom:1px solid var(--border)}
.acc-head{cursor:pointer;padding:14px 4px;display:flex;align-items:center;justify-content:space-between}
.acc-head .name{font-size:15px;font-weight:700;flex:1}
.acc-head .price{font-size:18px;font-weight:800;margin:0 10px}
.acc-head .chg{font-size:12px;font-weight:700;padding:2px 7px;border-radius:4px;min-width:50px;text-align:center}
.acc-head .arrow{font-size:14px;color:var(--sub);transition:.3s;min-width:20px;text-align:right}
.acc-head.open .arrow{transform:rotate(180deg)}
.acc-body{display:none;padding:0 4px 16px}
.acc-body.show{display:block}
.dl-section{margin-bottom:10px}
.dl-section h4{font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid #f0f2f5}
.divseg-svg{width:100%;display:block;margin:10px 0}
.trend-svg{width:100%;height:90px;margin-top:6px;display:block}
.trend-legend{font-size:9px;color:var(--sub);margin-top:4px}
.trend-legend .dot{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:3px;vertical-align:middle}
.hist{display:flex;gap:3px;font-size:10px;color:var(--sub);flex-wrap:wrap}
.hist span{background:#f0f2f5;padding:2px 5px;border-radius:3px}
.dates-row{display:flex;gap:12px;font-size:11px;color:var(--sub);padding:4px 0}
.sim-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.sim-row input{width:50px;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--bg);text-align:center;font-size:13px;font-weight:600}
.sim-row .out{font-weight:700;color:var(--orange);min-width:50px;text-align:right}
.sim-total{background:linear-gradient(135deg,#e8f0fe,#f3e5f5);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.sim-total .big{font-size:34px;font-weight:800}
.sim-total .label{font-size:12px;color:var(--sub);margin-top:4px}
.sim-detail{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:12px}
.sim-detail .sd{background:#f6f8fa;border-radius:8px;padding:8px;text-align:center;font-size:11px}
.sim-detail .sd .n{font-size:15px;font-weight:700}
.opp-item{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-stars{color:#f1c40f;font-size:10px;letter-spacing:2px;margin-left:4px}
.cal-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12px}
.cal-row .hot{background:#fde8e8;color:var(--red);padding:1px 7px;border-radius:4px;font-size:9px;font-weight:600}
.btn-refresh{display:block;width:100%;padding:10px;margin-bottom:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer}
.hidden{display:none}
footer{text-align:center;padding:14px 10px;font-size:10px;color:var(--sub)}
.errbox{background:#fee;border:1px solid #fcc;color:#c33;padding:12px;border-radius:8px;margin:12px 0;font-size:12px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
<h1>🥬 韭菜WinWin</h1>
<div class="st">股息率价值投资 · 今日判断</div>
<div class="refresh-bar" onclick="load()"><span id="time">点击刷新获取实时数据</span> 🔄</div>
</header>

<div class="tabs">
<button class="on" data-tab="dash" onclick="switchTab(this,'dash')">🏠 首页</button>
<button data-tab="detail" onclick="switchTab(this,'detail')">🔍 个股</button>
<button data-tab="divcenter" onclick="switchTab(this,'divcenter')">💰 分红中心</button>
<button data-tab="opp" onclick="switchTab(this,'opp')">⭐ 机会</button>
</div>

<div id="dash"></div>
<div id="detail" class="hidden"></div>
<div id="divcenter" class="hidden"></div>
<div id="opp" class="hidden"></div>

<footer>东方财富API · 价值投资观察站</footer>

<script>
// 全部逻辑包在 try 里，任何异常直接显示
try{

var shares={};
try{shares=JSON.parse(localStorage.getItem('vc_shares')||'{}');}catch(e){shares={};}

var CFG=[
{name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,tag:'tag-c',role:'周期弹性',roe:12.5,divHist:['2.50','2.55','2.55','2.55','2.70'],earn:'2026-08-28',divDt:'2026-10-20'},
{name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,tag:'tag-s',role:'稳定底仓',roe:14.8,divHist:['1.52','1.74','1.97','2.00','2.02'],earn:'2026-08-22',divDt:'2027-01-15'},
{name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,tag:'tag-d',role:'高股息',roe:18.2,divHist:['3.00','2.00','3.38','3.00','3.00'],earn:'2026-08-18',divDt:'2026-08-28'},
{name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,tag:'tag-b',role:'波动缓冲',roe:10.5,divHist:['2.09','3.87','4.41','4.56','4.70'],earn:'2026-08-15',divDt:'2026-09-10'},
];
var DIV_CAL=[
{s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:1},
{s:'中国移动',t:'年报',d:'2026-09',p10:22},
{s:'中国平安',t:'中报',d:'2026-10',p10:9.5},
{s:'招商银行',t:'中报',d:'2027-01',p10:10},
];
var data=[];

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2';
  try{
    var r=await fetch(u);
    if(r.ok){var j=await r.json();if(j&&j.data)return j.data}
  }catch(e){}
  return{};
}

function getAnn(code){for(var i=0;i<CFG.length;i++)if(CFG[i].code===code)return(shares[code]||0)*CFG[i].div;return 0}
function calcTotal(func){var t=0;for(var i=0;i<CFG.length;i++)t+=func(CFG[i].code);return t}

function divLevel(d){if(d<5)return'danger';if(d<5.3)return'yellow';if(d<5.5)return'warn';return'safe'}
function divColor(d){if(d<5)return'var(--red)';if(d<5.3)return'var(--orange)';if(d<5.5)return'var(--yellow)';return'var(--green)'}
function divBarPct(d){if(d<=4)return 0;if(d>=6)return 100;return(d-4)/2*100}

function advice(dist,divR){
  if(dist<0)return{text:'✅ 加仓',cls:'a-buy'};
  if(dist<=3&&divR>=5.3)return{text:'👀 等回踩',cls:'a-wait'};
  if(dist<=7&&divR>=5)return{text:'⏳ 观察',cls:'a-wait'};
  return{text:'🚫 不操作',cls:'a-nop'};
}

async function load(){
  document.getElementById('time').textContent='⏳ 加载中...';
  for(var i=0;i<CFG.length;i++){if(typeof shares[CFG[i].code]==='undefined')shares[CFG[i].code]=0;}
  data=[];
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i];
    var row={name:c.name,code:c.code,role:c.role,tag:c.tag,div:c.div,buy:c.buy,roe:c.roe,divHist:c.divHist,earn:c.earn,divDt:c.divDt,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false};
    try{
      var raw=await fetchOne(c.mkt,c.code);
      if(raw&&raw.f43){
        row.price=raw.f43;
        row.prev=raw.f60||0;
        row.chg=row.prev>0?((row.price-row.prev)/row.prev*100):0;
        row.pe=raw.f162||0;
        row.pb=raw.f167||0;
        row.mcap=(raw.f116||0)/1e8;
        row.divR=c.div/row.price*100;
        row.dist=(row.price-c.buy)/c.buy*100;
        row.needy=c.buy-row.price;
        row.ok=true;
      }
    }catch(e){}
    data.push(row);
  }
  renderAll();
  document.getElementById('time').textContent='🟢 '+new Date().toLocaleTimeString('zh-CN');
}

function showErr(e){
  var msg=e&&e.message?e.message:String(e);
  var detail=e&&e.stack?e.stack.split('\n').slice(0,3).join('\n'):'';
  return '<div class="errbox">⚠️ 渲染异常：'+msg+(detail?'\n'+detail:'')+'</div>';
}

function renderAll(){
  // 保存展开状态
  var openIdx=[];
  document.querySelectorAll('.acc-head.open').forEach(function(el){
    var i=parseInt(el.parentNode.getAttribute('data-idx')||-1);
    if(i>=0)openIdx.push(i);
  });
  var activeTab=document.querySelector('.tabs button.on');
  var activeTabId=activeTab?activeTab.getAttribute('data-tab'):'dash';

  // ═══ 首页 ═══
  var ann=Math.round(calcTotal(getAnn));
  var dash='<div class="sts">'+
    '<div class="st"><div class="l">标的</div><div class="v">'+CFG.length+'</div></div>'+
    '<div class="st"><div class="l">年分红</div><div class="v">¥'+ann.toLocaleString()+'</div></div>'+
    '<div class="st"><div class="l">月均</div><div class="v">¥'+(ann/12).toFixed(0)+'</div></div></div>';

  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){dash+='<div class="dc"><div class="dc-top"><span class="name">'+r.name+'</span></div><div style="font-size:11px;color:var(--sub)">加载中...</div></div>';continue;}
    var up=r.chg>0;
    var lvl=divLevel(r.divR);
    var clr=divColor(r.divR);
    var adv=advice(r.dist,r.divR);
    var pct=divBarPct(r.divR);
    var nudge='';
    if(r.needy>0)nudge='距补仓还需跌 ¥'+r.needy.toFixed(2);
    else if(r.needy<0)nudge='高于补仓价 ¥'+Math.abs(r.needy).toFixed(2);
    else nudge='已达到目标价';
    dash+='<div class="dc '+lvl+'"><div class="dc-top">'+
      '<div><span class="name">'+r.name+'</span><span class="code"> '+r.code+'</span> <span class="tag '+r.tag+'">'+r.role+'</span></div>'+
      '<span class="adv '+adv.cls+'">'+adv.text+'</span></div>'+
      '<div class="dc-p">¥'+r.price.toFixed(2)+' <span class="chip '+(up?'chip-up':'chip-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px"><span>股息率</span><b style="color:'+clr+'">'+r.divR.toFixed(2)+'%</b></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+pct+'%;background:'+clr+'"></div><div class="bar-dot" style="left:'+pct+'%;background:'+clr+'"></div></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--sub);margin-top:4px"><span>距目标</span><b>'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</b></div>'+
      '<div style="font-size:10px;color:var(--sub);margin-top:6px">'+nudge+'</div></div>';
  }
  document.getElementById('dash').innerHTML=dash;

  // ═══ 个股详情（折叠） ═══
  var detail='<div style="margin-bottom:12px;font-size:11px;color:var(--sub)">点击股票行展开查看详细数据</div>';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){detail+='<div class="acc-item" data-idx="'+i+'"><div class="acc-head"><span class="name">'+r.name+'</span><span style="font-size:11px;color:var(--sub)">加载中...</span><span class="arrow">▼</span></div></div>';continue;}
    var up=r.chg>0;
    var clr=divColor(r.divR);
    var pct=divBarPct(r.divR);
    var nudge='';
    if(r.needy>0)nudge='低于补仓价 ¥'+r.needy.toFixed(2)+' ✅ 可加仓';
    else if(r.needy<0)nudge='高于补仓价 ¥'+Math.abs(r.needy).toFixed(2);
    else nudge='等于补仓价';
    var adviceStr=r.needy>0?'已进入补仓区':r.dist<=5?'接近目标':'观望';

    // 分段条 SVG
    var rateVals=[6,5.5,5.3,5,4.5,4];
    var axesMin=r.div/0.07;
    var axesMax=r.div/0.035;
    function pos(p){return Math.max(1,Math.min(99,(p-axesMin)/(axesMax-axesMin)*100))}
    var segColors=['#d0f0d8','#c8eccf','#e8f5e0','#fff8d0','#ffe0c0','#fde8e8'];
    var txtColors=['#27ae60','#27ae60','#7fb069','#e5b800','#e67e22','#e74c3c'];
    var svg='<svg class="divseg-svg" viewBox="0 0 400 110">'; var segTop=28,segH=26,segBot=segTop+segH;
    for(var kk=0;kk<6;kk++){
      var lP=pos(r.div/(rateVals[kk]/100));
      var rP=kk<5?pos(r.div/(rateVals[kk+1]/100)):99;
      var segX=lP, segW=Math.max(2,rP-segX);
      svg+='<rect x="'+segX.toFixed(2)+'%" y="'+segTop+'" width="'+segW.toFixed(2)+'%" height="'+segH+'" fill="'+segColors[kk]+'" rx="3"/>';
    }
    // 标签错开上下避免重叠
    for(var kk=0;kk<6;kk++){
      var tX=pos(r.div/(rateVals[kk]/100));
      svg+='<line x1="'+tX.toFixed(2)+'%" y1="'+(segTop-2)+'" x2="'+tX.toFixed(2)+'%" y2="'+(segBot+2)+'" stroke="'+txtColors[kk]+'" stroke-width="1.2"/>';
      // 奇数下标标签在上，偶数在下，避免拥挤
      var lY=segBot+14; if(kk%2===0)lY=segBot+14; else lY=segBot+26;
      svg+='<text x="'+tX.toFixed(2)+'%" y="'+lY+'" font-size="10" font-weight="700" fill="'+txtColors[kk]+'" text-anchor="middle">'+rateVals[kk].toFixed(1)+'%</text>';
      svg+='<text x="'+tX.toFixed(2)+'%" y="'+(lY+12)+'" font-size="9" fill="#8b92a0" text-anchor="middle">'+(r.div/(rateVals[kk]/100)).toFixed(1)+'</text>';
    }
    // 大号倒三角+标签
    var curPct=pos(r.price);
    var lbW=8,lbX=Math.max(2,Math.min(100-lbW,curPct-lbW/2));
    svg+='<polygon points="'+(curPct-2.5)+'%,6 '+(curPct+2.5)+'%,6 '+curPct.toFixed(2)+'%,16" fill="#e74c3c"/>';
    svg+='<polygon points="'+(curPct-1.5)+'%,6 '+(curPct+1.5)+'%,6 '+curPct.toFixed(2)+'%,12" fill="#fff"/>';
    svg+='<rect x="'+lbX.toFixed(2)+'%" y="18" width="'+lbW.toFixed(2)+'%" height="16" rx="3" fill="#fff" stroke="#e74c3c" stroke-width="2"/>';
    svg+='<text x="'+((lbX+lbW/2)).toFixed(2)+'%" y="29" font-size="10" font-weight="800" fill="#e74c3c" text-anchor="middle">'+r.price.toFixed(2)+'</text>';
    svg+='<line x1="'+curPct.toFixed(2)+'%" y1="16" x2="'+curPct.toFixed(2)+'%" y2="'+(segTop-1)+'" stroke="#e74c3c" stroke-width="1.5" stroke-dasharray="3,3"/>';
    svg+='</svg>';

    // 营收净利组合图 SVG
    var bars='';
    var rev=null,np=null;
    if(r.code==='600036'){rev=[3313,3448,3391,3375,3300];np=[1200,1380,1466,1484,1502];}
    else if(r.code==='000651'){rev=[1897,1902,2050,1900,1711];np=[231,245,290,322,290];}
    else if(r.code==='601318'){rev=[11800,12200,9700,10300,11400];np=[1016,838,857,1267,1520];}
    else if(r.code==='600941'){rev=[8483,9373,10093,10408,10502];np=[1159,1255,1318,1384,1502];}
    if(rev){
      var rMax=Math.max.apply(null,rev);
      var nMax=Math.max.apply(null,np);
      var yrs=['21','22','23','24','25'];
      var w=320,h=90,padL=30,padR=8,padT=10,padB=18;
      var chartW=w-padL-padR,chartH=h-padT-padB;
      var barW=chartW/5*0.55;
      bars='<svg class="trend-svg" viewBox="0 0 '+w+' '+h+'">';
      bars+='<line x1="'+padL+'" y1="'+(padT+chartH*0.6)+'" x2="'+(w-padR)+'" y2="'+(padT+chartH*0.6)+'" stroke="#f0f2f5" stroke-width="0.5"/>';
      for(var bi=0;bi<5;bi++){
        var bx=padL+(bi+0.5)*(chartW/5)-barW/2;
        var bh=Math.max(2,(rev[bi]/rMax)*chartH);
        bars+='<rect x="'+bx.toFixed(1)+'" y="'+(padT+chartH-bh).toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+bh.toFixed(1)+'" fill="none" stroke="#5dade2" stroke-width="1.5" rx="2"/>';
        var revStr=rev[bi]>=10000?(rev[bi]/10000).toFixed(1)+'万':String(rev[bi]);
        bars+='<text x="'+(bx+barW/2).toFixed(1)+'" y="'+(padT+chartH-bh-4).toFixed(1)+'" font-size="7" fill="#333" text-anchor="middle" font-weight="600">'+revStr+'</text>';
      }
      var pts=[],npPos=[];
      for(var bi=0;bi<5;bi++){
        var px=padL+(bi+0.5)*(chartW/5);
        var py=padT+chartH-((np[bi]/nMax)*chartH*0.7);
        pts.push(px.toFixed(1)+','+py.toFixed(1));
        npPos.push({x:px,y:py,v:np[bi]});
      }
      bars+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="#e67e22" stroke-width="2"/>';
      for(var bi=0;bi<5;bi++){
        var p=npPos[bi];
        var isNeg=p.v<0;
        var cl=isNeg?'#e74c3c':'#e67e22';
        if(isNeg)bars+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="5" fill="none" stroke="#e74c3c" stroke-width="2"/>';
        bars+='<circle cx="'+p.x.toFixed(1)+'" cy="'+p.y.toFixed(1)+'" r="'+(isNeg?5:3)+'" fill="'+cl+'"/>';
        var npStr=p.v>=10000?(p.v/10000).toFixed(1)+'万':String(p.v);
        var labelY=isNeg?(p.y+12):(p.y-7);
        bars+='<text x="'+p.x.toFixed(1)+'" y="'+labelY.toFixed(1)+'" font-size="7" fill="'+cl+'" text-anchor="middle" font-weight="700">'+(isNeg?'⚠':'')+npStr+'</text>';
      }
      for(var bi=0;bi<5;bi++){
        var lx=padL+(bi+0.5)*(chartW/5);
        bars+='<text x="'+lx.toFixed(1)+'" y="'+(h-4)+'" font-size="8" fill="#8b92a0" text-anchor="middle">'+yrs[bi]+'</text>';
      }
      bars+='</svg>';
    }

    detail+='<div class="acc-item" data-idx="'+i+'"><div class="acc-head" onclick="toggleAcc(this)">'+
      '<span class="name">'+(i+1)+'. '+r.name+'</span>'+
      '<span class="price">¥'+r.price.toFixed(2)+'</span>'+
      '<span class="chg '+(up?'chip-up':'chip-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span>'+
      '<span class="arrow">▼</span></div>'+
    '<div class="acc-body">'+
      '<div class="dl-section"><h4>📈 估值</h4><div class="mg">'+
        '<div class="m"><span class="k">PE</span><span class="v">'+r.pe.toFixed(1)+'</span></div>'+
        '<div class="m"><span class="k">PB</span><span class="v">'+r.pb.toFixed(2)+'</span></div>'+
        '<div class="m"><span class="k">ROE</span><span class="v">'+r.roe.toFixed(1)+'%</span></div>'+
        '<div class="m"><span class="k">市值</span><span class="v">'+r.mcap.toFixed(0)+'亿</span></div>'+
      '</div></div>'+
      (bars?'<div class="dl-section"><h4>📊 营收 & 净利（亿）</h4><div class="trend-legend"><span class="dot" style="background:#5dade2"></span>营收 <span class="dot" style="background:#e67e22;margin-left:10px"></span>净利</div>'+bars+'</div>':'')+
      '<div class="dl-section"><h4>🎯 目标价分段（股息率节点）</h4><div style="font-size:10px;color:var(--sub);margin-bottom:4px">'+nudge+' · '+adviceStr+'</div>'+svg+'</div>'+
      '<div class="dl-section"><h4>💵 近五年每股分红</h4><div class="hist">'+(r.divHist||[]).map(function(v,i){return'<span>'+(i?'→ ':'')+'¥'+v+'</span>'}).join('')+'</div></div>'+
      '<div class="dl-section"><h4>📅 事件</h4><div class="dates-row"><span>📊 财报：'+(r.earn||'—')+'</span><span>💵 分红：'+(r.divDt||'—')+'</span></div></div>'+
    '</div></div>';
  }
  document.getElementById('detail').innerHTML=detail;

  // ═══ 分红中心 ═══
  var divs='<div class="sim-detail">'+
    '<div class="sd"><div style="color:var(--sub);font-size:10px">年分红</div><div class="n">¥'+ann.toLocaleString()+'</div></div>'+
    '<div class="sd"><div style="color:var(--sub);font-size:10px">月均</div><div class="n">¥'+(ann/12).toFixed(0)+'</div></div></div>'+
    '<div style="font-size:12px;color:var(--sub);margin-bottom:8px">输入持股数，自动计算年度分红</div>';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    divs+='<div class="sim-row"><span style="font-weight:600;min-width:60px">'+r.name+'</span><span style="color:var(--sub);font-size:10px">股</span><input type="number" value="'+(shares[r.code]||0)+'" min="0" onchange="onShareChange(\''+r.code+'\',this.value)" id="i_'+r.code+'"><span class="out" id="o_'+r.code+'">¥'+Math.round(getAnn(r.code))+'</span></div>';
  }
  divs+='<div class="sim-total"><div class="big" id="simT">¥'+ann.toLocaleString()+'</div><div class="label">预计年分红总额</div></div>';
  divs+='<div class="panel"><h2>📅 下次分红日历</h2>';
  for(var i=0;i<DIV_CAL.length;i++){
    var e=DIV_CAL[i];
    divs+='<div class="cal-row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span style="color:var(--sub)">'+e.d+'</span><span>10派¥'+e.p10+'</span>'+(e.hot?'<span class="hot">本月</span>':'')+'</div>';
  }
  divs+='</div>';
  document.getElementById('divcenter').innerHTML=divs;

  // ═══ 机会排行 ═══
  var opps='<div class="panel"><h2>⭐ 下次机会</h2>';
  var sorted=data.slice().filter(function(r){return r.buy>0&&r.ok;}).sort(function(a,b){return a.dist-b.dist;});
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    var stars='';
    var sc=r.dist<=0?5:r.dist<=3?4:r.dist<=5?3:r.dist<=8?2:1;
    for(var s=0;s<5;s++)stars+=s<sc?'★':'☆';
    var clr=r.dist<=5?'var(--green)':'var(--orange)';
    var needStr=r.needy>0?('需跌 ¥'+r.needy.toFixed(2)):'已在补仓区';
    opps+='<div class="opp-item"><span style="font-weight:700;min-width:24px">'+(i+1)+'.</span>'+
      '<div><div style="font-size:12px;font-weight:600">'+r.name+'</div><div style="font-size:10px;color:var(--sub)">¥'+r.price.toFixed(2)+' → ¥'+r.buy+' · '+needStr+'</div></div>'+
      '<div style="text-align:right"><div class="opp-stars">'+stars+'</div><div style="font-size:11px;font-weight:700;color:'+clr+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</div></div></div>';
  }
  opps+='</div>';
  document.getElementById('opp').innerHTML=opps;

  // 恢复展开状态 + tab
  openIdx.forEach(function(idx){
    var el=document.querySelector('[data-idx="'+idx+'"] .acc-head');
    if(el){el.classList.add('open');var body=el.nextElementSibling;if(body)body.classList.add('show');}
  });
  if(activeTabId){
    document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
    var at=document.querySelector('.tabs button[data-tab="'+activeTabId+'"]');if(at)at.classList.add('on');
    ['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
    var e=document.getElementById(activeTabId);if(e)e.classList.remove('hidden');
  }
}

function onShareChange(code,val){
  shares[code]=parseInt(val)||0;
  try{localStorage.setItem('vc_shares',JSON.stringify(shares));}catch(e){}
  var o=document.getElementById('o_'+code);
  if(o)o.textContent='¥'+Math.round(getAnn(code));
  var ann=Math.round(calcTotal(getAnn));
  var t=document.getElementById('simT');
  if(t)t.textContent='¥'+ann.toLocaleString();
}

function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  ['dash','detail','divcenter','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
  var e=document.getElementById(id);if(e)e.classList.remove('hidden');
}

function toggleAcc(el){
  var body=el.nextElementSibling;
  body.classList.toggle('show');
  el.classList.toggle('open');
}

// 立即执行首次加载 + 每分钟刷新
load();
setInterval(load,60000);

}catch(e){
  document.body.innerHTML='<div class="errbox">⚠️ 脚本错误：'+e.message+'<br><br>'+e.stack+'</div>';
}
</script>
</body>
</html>
