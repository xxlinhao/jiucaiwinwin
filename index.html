<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>价值投资股票观察站</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1a1a2e;--sub:#888;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#e67e22;--purple:#8e44ad;--border:#e8eaed;--shadow:0 1px 3px rgba(0,0,0,.06)}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px;max-width:800px;margin:0 auto}
header{text-align:center;padding:14px 0 8px}
header h1{font-size:20px;font-weight:800}header .time{font-size:11px;color:var(--sub);margin-top:3px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.stat{background:var(--card);border-radius:10px;padding:10px;text-align:center;box-shadow:var(--shadow)}
.stat .l{font-size:10px;color:var(--sub)}.stat .v{font-size:22px;font-weight:700;margin-top:3px}
.card{background:var(--card);border-radius:10px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.card-name{font-size:16px;font-weight:700}.card-code{font-size:11px;color:var(--sub);margin-left:4px}
.card-tag{font-size:10px;padding:2px 8px;border-radius:8px;font-weight:600}
.tag-s{background:#e8f5e9;color:#27ae60}.tag-d{background:#fdebd0;color:#e67e22}
.tag-c{background:#eaf2f8;color:#2980b9}.tag-b{background:#f4ecf7;color:#8e44ad}
.card-body{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.detail{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #f0f0f0;font-size:12px}
.detail .k{color:var(--sub)}.detail .v{font-weight:600;text-align:right}
.price-big{font-size:22px;font-weight:800;text-align:center;margin:8px 0}
.chg-badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:4px;color:#fff}
.chg-up{background:var(--red)}.chg-down{background:var(--green)}
.div-history{font-size:10px;color:var(--sub);margin-top:4px;display:flex;gap:2px}
.div-history span{background:#f8f9fa;padding:1px 5px;border-radius:3px}
.div-range{height:4px;border-radius:2px;background:#eee;margin-top:2px;position:relative}
.div-range-bar{height:100%;border-radius:2px;background:var(--orange);position:absolute}
.div-range-dot{width:6px;height:6px;border-radius:50%;background:var(--red);position:absolute;top:-1px;transform:translateX(-50%)}
.section{margin-top:16px}.section h2{font-size:15px;margin-bottom:8px;padding-bottom:6px;border-bottom:2px solid var(--border)}
.tabs{display:flex;gap:2px;margin-bottom:12px;background:var(--card);border-radius:8px;padding:3px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:9px 4px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;background:none;color:var(--sub);transition:.15s}
.tabs button.on{background:var(--blue);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.row .r{font-size:11px;color:var(--sub)}
.badge-hot{background:#ffeaea;color:var(--red);padding:2px 8px;border-radius:8px;font-size:10px;font-weight:600;margin-left:6px}
.opp-item{background:#f8f9fa;border-radius:8px;padding:10px 12px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.sim-box{display:flex;align-items:center;gap:8px;margin:8px 0;padding:8px 10px;background:#f8f9fa;border-radius:8px;font-size:12px}
.sim-box input{width:60px;padding:4px 6px;border:1px solid var(--border);border-radius:4px;text-align:center;font-size:13px}
.sim-result{font-weight:700;color:var(--orange)}
.summary-box{background:linear-gradient(135deg,#2980b9,#8e44ad);color:#fff;border-radius:12px;padding:14px 16px;margin:12px 0;text-align:center;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.summary-box .big-num{font-size:32px;font-weight:800}
.summary-box .label{font-size:13px;opacity:.9;margin-top:4px}
.btn-refresh{display:block;width:100%;padding:10px;margin:12px 0;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;color:#fff;background:var(--blue);transition:.2s}
.btn-refresh:active{opacity:.8}
footer{text-align:center;padding:12px;font-size:10px;color:var(--sub)}
.hidden{display:none}
</style>
</head>
<body>
<header><h1>📈 价值投资股票观察站</h1><div class="time" id="time">点击下方按钮加载数据</div></header>

<div class="stats" id="stats"><div class="loading">⏳</div></div>

<div class="tabs">
  <button class="on" onclick="switchTab(this,'cards')">📊 监控</button>
  <button onclick="switchTab(this,'sim')">💰 模拟器</button>
  <button onclick="switchTab(this,'opp')">⭐ 机会</button>
  <button onclick="switchTab(this,'div')">📅 日历</button>
</div>

<button class="btn-refresh" onclick="load()">🔄 刷新数据</button>

<div id="cards"></div>
<div id="sim" class="section hidden"></div>
<div id="opp" class="section hidden"></div>
<div id="div" class="section hidden"></div>

<footer>东方财富API · 价值投资观察站 · GitHub Pages</footer>

<script>
var CFG=[
  {
    name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,role:'周期弹性',tag:'tag-c',
    roe:12.5, divHist:['2.50','2.55','2.55','2.55','2.70'],
    divMin:4.0,divMax:7.5, earnDate:'2026-08-28',divDate:'2026-10-20',
  },
  {
    name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,role:'稳定底仓',tag:'tag-s',
    roe:14.8, divHist:['1.52','1.74','1.97','2.00','2.02'],
    divMin:3.5,divMax:6.5, earnDate:'2026-08-22',divDate:'2027-01-15',
  },
  {
    name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,role:'高股息',tag:'tag-d',
    roe:18.2, divHist:['3.00','2.00','3.38','3.00','3.00'],
    divMin:5.0,divMax:11.0, earnDate:'2026-08-18',divDate:'2026-08-28',
  },
  {
    name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,role:'波动缓冲',tag:'tag-b',
    roe:10.5, divHist:['2.09','3.87','4.41','4.56','4.70'],
    divMin:3.5,divMax:6.0, earnDate:'2026-08-15',divDate:'2026-09-10',
  },
];
var DIV_CAL=[
  {s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:true},
  {s:'中国移动',t:'年报',d:'2026-09',p10:22},
  {s:'中国平安',t:'中报',d:'2026-10',p10:9.5},
  {s:'招商银行',t:'中报',d:'2027-01',p10:10},
];
var shares={};
var data=[];

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2';
  // 试公共CORS代理（file://和移动端都能用）
  try{
    var proxy='https://corsproxy.io/?'+u;
    var r=await fetch(proxy);
    if(r.ok){
      var j=await r.json();
      if(j.data)return j.data;
    }
  }catch(e){}
  try{
    var r=await fetch(u);
    if(r.ok){
      var j=await r.json();
      if(j.data)return j.data;
    }
  }catch(e){}
  return{};
}

async function load(){
  document.getElementById('time').textContent='加载中...';
  data=[];
  for(var i=0;i<CFG.length;i++){
    var c=CFG[i];
    if(!shares[c.code])shares[c.code]=100;
    try{
      var raw=await fetchOne(c.mkt,c.code);
      var p=raw.f43||0,pc=raw.f60||0;
      data.push({...c,price:p,prev:pc,
        chg:pc>0?((p-pc)/pc*100):0,
        hi:raw.f44||0,lo:raw.f45||0,op:raw.f46||0,
        pe:raw.f162||0,pb:raw.f167||0,mcap:(raw.f116||0)/1e8,
        divR:p>0?(c.div/p*100):0,
        dist:c.buy>0?((p-c.buy)/c.buy*100):0,
      });
    }catch(e){data.push({...c,err:true})}
  }
  renderAll();
  document.getElementById('time').textContent='🟢 '+(new Date()).toLocaleString('zh-CN');
}

function getAnn(code){return(shares[code]||0)*(CFG.filter(function(c){return c.code===code})[0].div)}
function calcTotal(func){var t=0;for(var i=0;i<CFG.length;i++)t+=func(CFG[i].code);return t}

function renderAll(){
  var ann=Math.round(calcTotal(getAnn));
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="l">监控标的</div><div class="v">'+CFG.length+'只</div></div>'+
    '<div class="stat"><div class="l">年分红预估</div><div class="v">¥'+ann.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">月均现金流</div><div class="v">¥'+(ann/12).toFixed(0)+'</div></div>';

  // 概览卡片 — 全新布局
  document.getElementById('cards').innerHTML=data.map(function(r){
    if(r.err)return'<div class="card"><div class="card-name">'+r.name+'</div>接口异常</div>';
    var up=r.chg>0;
    var divPct=((r.divR-r.divMin)/(r.divMax-r.divMin)*100);
    divPct=Math.min(100,Math.max(0,divPct));
    return'<div class="card">'+
      // 标题行
      '<div class="card-head"><div><span class="card-name">'+r.name+'</span><span class="card-code">'+r.code+'</span><span class="card-tag '+r.tag+'">'+r.role+'</span></div>'+
        '<div style="text-align:right"><div style="font-size:10px;color:var(--sub)">补仓≤¥'+r.buy+'</div><div style="font-size:13px;font-weight:700;color:'+(r.dist<=5?'#27ae60':'#e67e22')+'">距目标 '+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</div></div></div>'+
      // 价格行
      '<div class="price-big">'+r.price.toFixed(2)+' <span class="chg-badge '+(up?'chg-up':'chg-down')+'" style="font-size:14px">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      // 详情网格
      '<div class="card-body">'+
        '<div class="detail"><span class="k">PE（TTM）</span><span class="v">'+r.pe.toFixed(1)+'</span></div>'+
        '<div class="detail"><span class="k">PB</span><span class="v">'+r.pb.toFixed(2)+'</span></div>'+
        '<div class="detail"><span class="k">ROE</span><span class="v">'+(r.roe||0).toFixed(1)+'%</span></div>'+
        '<div class="detail"><span class="k">每股分红</span><span class="v">¥'+r.div.toFixed(2)+'</span></div>'+
        '<div class="detail"><span class="k">当前股息率</span><span class="v" style="color:#e67e22">'+r.divR.toFixed(2)+'%</span></div>'+
        '<div class="detail"><span class="k">市值</span><span class="v">'+r.mcap.toFixed(0)+'亿</span></div>'+
      '</div>'+
      // 5年分红
      '<div style="margin-top:6px;font-size:11px;color:var(--sub)">近5年每股分红：<div class="div-history">'+
        (r.divHist||[]).map(function(v,i){return'<span>'+(i===0?'':'→ ')+'¥'+v+'</span>'}).join('')+
      '</div></div>'+
      // 股息率走势条
      '<div style="margin-top:6px;font-size:11px;color:var(--sub)">股息率区间 '+r.divMin+'% ~ '+r.divMax+'%<div class="div-range"><div class="div-range-bar" style="width:100%"></div><div class="div-range-dot" style="left:'+divPct+'%"></div></div></div>'+
      // 财报/分红日期
      '<div style="margin-top:8px;display:flex;gap:12px;font-size:11px;color:var(--sub)">'+
        '<span>📅 财报：'+(r.earnDate||'—')+'</span><span>💵 分红：'+(r.divDate||'—')+'</span>'+
      '</div>'+
    '</div>';
  }).join('');

  // 分红模拟器
  document.getElementById('sim').innerHTML='<h2>💰 分红模拟器</h2><div style="font-size:12px;color:var(--sub);margin-bottom:10px">输入持股数量，自动计算年度分红</div>'+
    data.filter(function(r){return!r.err}).map(function(r){
      return'<div class="sim-box"><span style="font-weight:700;min-width:70px">'+r.name+'</span>'+
        '<label>股数</label><input type="number" value="'+(shares[r.code]||0)+'" min="0" onchange="updateShares(\''+r.code+'\',this.value)" id="inp_'+r.code+'">'+
        '<span style="flex:1;text-align:right"><span class="sim-result" id="res_'+r.code+'">¥'+Math.round(getAnn(r.code))+'</span><span class="r"> /年</span></span></div>';
    }).join('')+
    '<div class="summary-box"><div class="big-num" id="simTotal">¥'+Math.round(calcTotal(getAnn)).toLocaleString()+'</div><div class="label">预计年分红总额</div></div>';

  // 机会排行
  document.getElementById('opp').innerHTML='<h2>⭐ 买入机会提示</h2><div style="font-size:12px;color:var(--sub);margin-bottom:10px">距目标补仓价排序，越小机会越大</div>'+
    data.filter(function(r){return r.buy>0}).sort(function(a,b){return a.dist-b.dist}).map(function(r,i){
      var tDivR=(r.div/r.buy*100).toFixed(1),clr=r.dist<=5?'#27ae60':'#e67e22';
      return'<div class="opp-item">'+
        '<span style="font-weight:700">'+(i+1)+'. '+r.name+'</span>'+
        '<span style="font-size:11px;color:var(--sub)">¥'+r.price.toFixed(2)+' → ¥'+r.buy+'（目标息率'+tDivR+'%）</span>'+
        '<span style="font-weight:700;color:'+clr+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</span></div>';
    }).join('');

  // 分红日历
  document.getElementById('div').innerHTML='<h2>📅 财报/分红日历</h2>'+
    DIV_CAL.map(function(e){
      return'<div class="row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span class="r">'+e.d+'</span>'+
        '<span>10派'+e.p10+'元</span>'+(e.hot?'<span class="badge-hot">本月</span>':'')+'</div>';
    }).join('');
}

function updateShares(code,val){
  shares[code]=parseInt(val)||0;
  document.getElementById('res_'+code).textContent='¥'+Math.round(getAnn(code));
  document.getElementById('simTotal').textContent='¥'+Math.round(calcTotal(getAnn)).toLocaleString();
  var ann=Math.round(calcTotal(getAnn));
  document.getElementById('stats').innerHTML=
    '<div class="stat"><div class="l">监控标的</div><div class="v">'+CFG.length+'只</div></div>'+
    '<div class="stat"><div class="l">年分红预估</div><div class="v">¥'+ann.toLocaleString()+'</div></div>'+
    '<div class="stat"><div class="l">月均现金流</div><div class="v">¥'+(ann/12).toFixed(0)+'</div></div>';
}

function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  document.querySelectorAll('#cards,#sim,#opp,#div').forEach(function(e){e.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');
}

load();
</script>
</body>
</html>
