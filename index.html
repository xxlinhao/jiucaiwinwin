<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>韭菜WinWin</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--border:#30363d;--text:#c9d1d9;--sub:#8b949e;--red:#ff4757;--green:#2ed573;--blue:#58a6ff;--orange:#ffa502;--purple:#a55eea;--teal:#2bcbba}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto;-webkit-font-smoothing:antialiased}
header{padding:20px 0 14px;text-align:center;border-bottom:1px solid var(--border);margin-bottom:16px}
header h1{font-size:17px;font-weight:700;letter-spacing:-.3px}
header .t{font-size:11px;color:var(--sub);margin-top:4px}
.refresh-btn{display:block;width:100%;padding:10px;border:1px solid var(--border);border-radius:10px;background:var(--card);color:var(--blue);font-size:12px;font-weight:600;cursor:pointer;margin-bottom:14px;transition:.2s}
.refresh-btn:active{opacity:.7}
/* Stats row */
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px}
.st{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 8px;text-align:center}
.st .l{font-size:10px;color:var(--sub)}.st .v{font-size:20px;font-weight:800;margin-top:3px}
/* Widget cards */
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;margin-bottom:10px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:2px 0 0 2px}
.card.safe::before{background:var(--green)}
.card.warn::before{background:var(--orange)}
.card.danger::before{background:var(--red)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.card-head .name{font-size:15px;font-weight:700;letter-spacing:-.2px}
.card-head .code{font-size:11px;color:var(--sub);margin-left:4px}
.card-head .tag{font-size:10px;padding:2px 7px;border-radius:6px;font-weight:600;display:inline-block}
.t-s{background:#0d2b1e;color:var(--green)}.t-d{background:#3d2800;color:var(--orange)}
.t-c{background:#0d2137;color:var(--blue)}.t-b{background:#1e1135;color:var(--purple)}
/* Price block */
.price-block{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 10px}
.price{font-size:30px;font-weight:800;letter-spacing:-1px}
.chg{font-size:12px;font-weight:700;padding:3px 8px;border-radius:5px}
.chg-up{background:#2d0f15;color:var(--red)}.chg-down{background:#0d1f17;color:var(--green)}
.target-info{text-align:right;font-size:10px;color:var(--sub)}
.target-info .dist{font-size:13px;font-weight:700}
/* Metrics grid */
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin-bottom:8px}
.mgrid .m{display:flex;justify-content:space-between;font-size:11px;padding:2px 0;border-bottom:1px solid rgba(48,54,61,.5)}
.mgrid .m .k{color:var(--sub)}.mgrid .m .kv{font-weight:600}
/* Dividend progress bar */
.div-bar{margin-top:6px}
.div-bar .bar-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--sub);margin-bottom:3px}
.div-bar .bar-track{height:5px;background:#21262d;border-radius:3px;position:relative}
.div-bar .bar-fill{position:absolute;height:100%;border-radius:3px;transition:.5s}
.div-bar .bar-dot{position:absolute;width:10px;height:10px;background:var(--text);border:2px solid var(--blue);border-radius:50%;top:-3px;transform:translateX(-50%);box-shadow:0 0 6px rgba(88,166,255,.4)}
.div-bar .bar-cur{font-size:9px;color:var(--text);font-weight:600;position:absolute;top:-16px;transform:translateX(-50%);white-space:nowrap}
/* History row */
.hrow{display:flex;gap:4px;align-items:center;font-size:9px;color:var(--sub);margin-top:5px}
.hrow .yr{background:#21262d;padding:1px 5px;border-radius:3px}
/* Dates row */
.dates{display:flex;gap:12px;font-size:10px;color:var(--sub);margin-top:6px;padding-top:6px;border-top:1px solid rgba(48,54,61,.3)}
/* Simulator */
.sim-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--border);font-size:12px}
.sim-row input{width:50px;padding:5px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);text-align:center;font-size:12px}
.sim-row .out{font-weight:700;color:var(--orange);min-width:60px;text-align:right}
.sim-total{background:linear-gradient(135deg,#1a2a4a,#2a1a4a);border:1px solid var(--border);border-radius:14px;padding:16px;text-align:center;margin-top:12px}
.sim-total .big{font-size:34px;font-weight:800}
.sim-total .label{font-size:12px;color:var(--sub);margin-top:4px}
/* Opportunity */
.opp-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:12px}
.opp-card .rank{font-weight:700;width:20px}.opp-card .status{font-weight:700;min-width:50px;text-align:right}
/* Calendar */
.cal-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);font-size:12px}
.badge-hot{background:#2d0f15;color:var(--red);padding:2px 8px;border-radius:6px;font-size:9px;font-weight:600}
/* Tabs */
.tabs{display:flex;gap:3px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--sub);transition:.15s}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.hidden{display:none}
footer{text-align:center;padding:20px 10px;font-size:10px;color:var(--sub)}
.loading{text-align:center;padding:30px;color:var(--sub)}
</style>
</head>
<body>
<header><h1>🥬 韭菜WinWin</h1><div style="font-size:10px;color:var(--sub);margin-top:2px">价值投资观察站 · 股息率为王</div><div class="t" id="time">点击刷新获取实时数据</div></header>
<div class="stats" id="stats"><div class="loading">⏳</div></div>
<div class="tabs">
  <button class="on" onclick="switchTab(this,'cards')">📊 看板</button>
  <button onclick="switchTab(this,'sim')">💰 模拟器</button>
  <button onclick="switchTab(this,'opp')">⭐ 机会</button>
  <button onclick="switchTab(this,'div')">📅 日历</button>
</div>
<button class="refresh-btn" onclick="load()">🔄 刷新数据</button>
<div id="cards"></div><div id="sim" class="hidden"></div><div id="opp" class="hidden"></div><div id="div" class="hidden"></div>
<footer>东方财富API · 价值投资观察站</footer>

<script>
var CFG=[{name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,tag:'t-c',role:'周期弹性',roe:12.5,divHist:['2.50','2.55','2.55','2.55','2.70'],divMin:4,divMax:7.5,earn:'2026-08-28',divDt:'2026-10-20'},{name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,tag:'t-s',role:'稳定底仓',roe:14.8,divHist:['1.52','1.74','1.97','2.00','2.02'],divMin:3.5,divMax:6.5,earn:'2026-08-22',divDt:'2027-01-15'},{name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,tag:'t-d',role:'高股息',roe:18.2,divHist:['3.00','2.00','3.38','3.00','3.00'],divMin:5,divMax:11,earn:'2026-08-18',divDt:'2026-08-28'},{name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,tag:'t-b',role:'波动缓冲',roe:10.5,divHist:['2.09','3.87','4.41','4.56','4.70'],divMin:3.5,divMax:6,earn:'2026-08-15',divDt:'2026-09-10'}];
var DIV_CAL=[{s:'格力电器',t:'年报',d:'2026-08',p10:20,hot:1},{s:'中国移动',t:'年报',d:'2026-09',p10:22},{s:'中国平安',t:'中报',d:'2026-10',p10:9.5},{s:'招商银行',t:'中报',d:'2027-01',p10:10}];
var shares=JSON.parse(localStorage.getItem('vc_shares')||'{}');
var data=[];

async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f44,f45,f46,f50,f60,f162,f167,f116,f169&invt=2&fltt=2';
  var proxies=[
    'https://corsproxy.io/?',
    'https://api.allorigins.win/raw?url=',
    'https://api.codetabs.com/v1/proxy?quest=',
    '',
  ];
  for(var i=0;i<proxies.length;i++){
    try{
      var ru=proxies[i]+u;
      var r=await fetch(ru);
      if(!r.ok)continue;
      var j=await r.json();
      if(j.data)return j.data;
    }catch(e){}
  }
  return{};
}

function getAnn(code){return(shares[code]||0)*CFG.filter(function(c){return c.code===code})[0].div}
function calcTotal(func){var t=0;for(var i=0;i<CFG.length;i++)t+=func(CFG[i].code);return t}

async function load(){
  document.getElementById('time').textContent='加载中...';
  data=[];
  for(var i=0;i<CFG.length;i++){var c=CFG[i];if(shares[c.code]===undefined)shares[c.code]=0;try{var raw=await fetchOne(c.mkt,c.code);var p=raw.f43||0,pc=raw.f60||0;data.push({...c,price:p,prev:pc,chg:pc>0?((p-pc)/pc*100):0,hi:raw.f44||0,lo:raw.f45||0,op:raw.f46||0,pe:raw.f162||0,pb:raw.f167||0,mcap:(raw.f116||0)/1e8,divR:p>0?(c.div/p*100):0,dist:c.buy>0?((p-c.buy)/c.buy*100):0,ok:!!p})}catch(e){data.push({...c,ok:false})}}
  renderAll();
  document.getElementById('time').textContent='🟢 '+(new Date()).toLocaleString('zh-CN');
}

function getState(dist){return dist<0?'safe':dist<=5?'warn':'danger'}

function renderAll(){
  var ann=Math.round(calcTotal(getAnn));
  // Stats
  document.getElementById('stats').innerHTML='<div class="st"><div class="l">标的</div><div class="v">'+CFG.length+'</div></div><div class="st"><div class="l">年分红</div><div class="v">¥'+ann.toLocaleString()+'</div></div><div class="st"><div class="l">月均</div><div class="v">¥'+(ann/12).toFixed(0)+'</div></div>';

  // Cards
  document.getElementById('cards').innerHTML=data.map(function(r){
    if(!r.ok)return'<div class="card"><div class="card-head"><span class="name">'+r.name+'</span></div><div style="font-size:11px;color:var(--sub);padding:8px 0">暂无法获取数据，请点击刷新</div></div>';
    var up=r.chg>0;var st=getState(r.dist);
    var divPct=Math.min(100,Math.max(0,(r.divR-r.divMin)/(r.divMax-r.divMin)*100));
    var barColor=r.divR>=8?var(--red):r.divR>=5?var(--orange):var(--blue);
    return'<div class="card '+st+'"><div class="card-head"><div><span class="name">'+r.name+'</span><span class="code"> '+r.code+'</span><span class="tag '+r.tag+'">'+r.role+'</span></div><div class="target-info">补仓≤¥'+r.buy+'<br><span class="dist" style="color:'+(r.dist<=5?'var(--green)':'var(--orange)')+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</span></div></div><div class="price-block"><span class="price">'+r.price.toFixed(2)+'</span><span class="chg '+(up?'chg-up':'chg-down')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div><div class="mgrid"><div class="m"><span class="k">PE</span><span class="kv">'+r.pe.toFixed(1)+'</span></div><div class="m"><span class="k">PB</span><span class="kv">'+r.pb.toFixed(2)+'</span></div><div class="m"><span class="k">ROE</span><span class="kv">'+r.roe.toFixed(1)+'%</span></div><div class="m"><span class="k">分红/股</span><span class="kv">¥'+r.div.toFixed(2)+'</span></div><div class="m"><span class="k">市值</span><span class="kv">'+r.mcap.toFixed(0)+'亿</span></div><div class="m"><span class="k">股息率</span><span class="kv" style="color:'+(r.divR>=7?'var(--red)':r.divR>=5?'var(--orange)':'var(--blue)')+'">'+r.divR.toFixed(2)+'%</span></div></div><div class="div-bar"><div class="bar-labels"><span>'+r.divMin+'%</span><span style="font-size:10px;font-weight:700;color:'+(r.divR>=7?'var(--red)':r.divR>=5?'var(--orange)':'var(--blue)')+'">'+r.divR.toFixed(1)+'%</span><span>'+r.divMax+'%</span></div><div class="bar-track"><div class="bar-fill" style="width:'+divPct+'%;background:linear-gradient(90deg,'+(r.divR>=7?'var(--red)':r.divR>=5?'var(--orange)':'var(--blue)')+','+(r.divR>=7?'var(--red)':r.divR>=5?'var(--orange)':'var(--blue)')+')"></div><div class="bar-dot" style="left:'+divPct+'%"></div></div></div><div class="hrow">近5年分红 '+(r.divHist||[]).map(function(v,i){return'<span class="yr">'+(i?'→ ':'')+'¥'+v+'</span>'}).join('')+'</div><div class="dates"><span>📅 '+r.earn+'</span><span>💵 '+r.divDt+'</span></div></div>';
  }).join('');

  // Simulator
  document.getElementById('sim').innerHTML='<div style="font-size:12px;color:var(--sub);margin-bottom:10px">输入持股数，自动计算年分红</div>'+data.filter(function(r){return r.ok}).map(function(r){return'<div class="sim-row"><span style="font-weight:600;min-width:64px">'+r.name+'</span><span style="color:var(--sub)">股</span><input type="number" value="'+(shares[r.code]||0)+'" min="0" onchange="s(\''+r.code+'\',this.value)" id="i_'+r.code+'"><span class="out" id="o_'+r.code+'">¥'+Math.round(getAnn(r.code))+'/年</span></div>'}).join('')+'<div class="sim-total"><div class="big" id="simT">¥'+Math.round(calcTotal(getAnn)).toLocaleString()+'</div><div class="label">预计年分红总额</div></div>';

  // Opportunity
  document.getElementById('opp').innerHTML='<div style="font-size:12px;color:var(--sub);margin-bottom:10px">距目标补仓价排序</div>'+data.filter(function(r){return r.buy>0}).sort(function(a,b){return a.dist-b.dist}).map(function(r,i){var clr=r.dist<=5?'var(--green)':'var(--orange)';return'<div class="opp-card"><span class="rank">'+(i+1)+'</span><span>'+r.name+'</span><span style="font-size:10px;color:var(--sub)">¥'+r.price.toFixed(2)+'→¥'+r.buy+'</span><span class="status" style="color:'+clr+'">'+(r.dist>=0?'+':'')+r.dist.toFixed(1)+'%</span></div>'}).join('');

  // Calendar
  document.getElementById('div').innerHTML='<div style="font-size:12px;color:var(--sub);margin-bottom:8px">分红与财报日程</div>'+DIV_CAL.map(function(e){return'<div class="cal-row"><span><b>'+e.s+'</b>（'+e.t+'）</span><span>'+e.d+'</span><span>10派'+e.p10+'元</span>'+(e.hot?'<span class="badge-hot">本月</span>':'')+'</div>'}).join('');
}

function s(code,val){shares[code]=parseInt(val)||0;localStorage.setItem('vc_shares',JSON.stringify(shares));document.getElementById('o_'+code).textContent='¥'+Math.round(getAnn(code))+'/年';document.getElementById('simT').textContent='¥'+Math.round(calcTotal(getAnn)).toLocaleString();var ann=Math.round(calcTotal(getAnn));document.getElementById('stats').innerHTML='<div class="st"><div class="l">标的</div><div class="v">'+CFG.length+'</div></div><div class="st"><div class="l">年分红</div><div class="v">¥'+ann.toLocaleString()+'</div></div><div class="st"><div class="l">月均</div><div class="v">¥'+(ann/12).toFixed(0)+'</div></div>'}

function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  document.querySelectorAll('#cards,#sim,#opp,#div').forEach(function(e){e.classList.add('hidden')});
  document.getElementById(id).classList.remove('hidden');
}

load();
</script>
</body>
</html>
