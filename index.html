<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>咸鱼WinWin</title>
<style>
:root{--bg:#f2f4f7;--card:#fff;--border:#e4e7ed;--text:#1d1d2e;--sub:#8b92a0;--red:#e74c3c;--green:#27ae60;--blue:#2980b9;--orange:#f39c12}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','PingFang SC',sans-serif;background:var(--bg);color:var(--text);padding:12px 14px;max-width:480px;margin:0 auto}
header{padding:14px 0 8px;text-align:center}
header h1{font-size:18px;font-weight:800}
header .st{font-size:11px;color:var(--sub);margin-top:2px}
.refresh-bar{padding:8px;margin:8px 0 12px;background:var(--card);border:1px solid var(--border);border-radius:10px;font-size:11px;color:var(--sub);text-align:center;cursor:pointer}
.tabs{display:flex;gap:3px;margin-bottom:12px}
.tabs button{flex:1;padding:9px;border:1px solid var(--border);border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;background:var(--card);color:var(--sub)}
.tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px}
.panel h2{font-size:14px;font-weight:700;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.hidden{display:none}
footer{text-align:center;padding:14px 10px;font-size:10px;color:var(--sub)}
.btn{display:block;width:100%;padding:12px;background:var(--blue);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px}
.ldg{text-align:center;padding:20px;color:var(--sub)}
</style>
</head>
<body>
<header>
<h1>🐟 咸鱼WinWin</h1>
<div class="st">做人如果没有梦想，跟咸鱼有什么分别</div>
<div class="refresh-bar" onclick="load()"><span id="time">点击这里刷新行情数据</span> 🔄</div>
</header>

<div class="tabs">
<button class="on" data-tab="settings" onclick="switchTab(this,'settings')">⚙️ 设置</button>
<button data-tab="dash" onclick="switchTab(this,'dash')">🏠 首页</button>
<button data-tab="detail" onclick="switchTab(this,'detail')">🔍 个股</button>
<button data-tab="monitor" onclick="switchTab(this,'monitor')">📊 监控</button>
<button data-tab="opp" onclick="switchTab(this,'opp')">📊 持仓</button>
</div>

<div id="settings"></div>
<div id="dash" class="hidden"></div>
<div id="detail" class="hidden"></div>
<div id="monitor" class="hidden"></div>
<div id="opp" class="hidden"></div>

<footer>东方财富API · 价值投资观察站</footer>

<script>
var CFG=[
{name:'工商银行',code:'601398',mkt:1,div:0.32,buy:5.5,cat:'大金融',divHist:['0.26','0.28','0.29','0.30','0.32']},
{name:'建设银行',code:'601939',mkt:1,div:0.39,buy:6.5,cat:'大金融',divHist:['0.32','0.34','0.36','0.38','0.39']},
{name:'招商银行',code:'600036',mkt:1,div:2.016,buy:37,cat:'大金融',divHist:['1.52','1.74','1.97','2.00','2.02']},
{name:'农业银行',code:'601288',mkt:1,div:0.20,buy:4,cat:'大金融',divHist:['0.17','0.18','0.19','0.19','0.20']},
{name:'中国平安',code:'601318',mkt:1,div:2.70,buy:50,cat:'大金融',divHist:['2.50','2.55','2.55','2.55','2.70']},
{name:'中国人寿',code:'601628',mkt:1,div:0.65,buy:30,cat:'大金融',divHist:['0.50','0.55','0.60','0.63','0.65']},
{name:'长江电力',code:'600900',mkt:1,div:0.943,buy:25,cat:'公用事业',divHist:['0.82','0.85','0.82','0.94','0.98']},
{name:'国电电力',code:'600795',mkt:1,div:0.08,buy:3.5,cat:'公用事业',divHist:['0.05','0.06','0.07','0.08','0.08']},
{name:'中国核电',code:'601985',mkt:1,div:0.16,buy:7,cat:'公用事业',divHist:['0.10','0.12','0.13','0.15','0.16']},
{name:'中国移动',code:'600941',mkt:1,div:4.70,buy:88,cat:'公用事业',divHist:['2.09','3.87','4.41','4.56','4.70']},
{name:'中国神华',code:'601088',mkt:1,div:2.20,buy:30,cat:'能源资源',divHist:['1.81','2.00','2.10','2.15','2.20']},
{name:'陕西煤业',code:'601225',mkt:1,div:2.00,buy:20,cat:'能源资源',divHist:['1.50','1.80','1.90','1.95','2.00']},
{name:'中国石化',code:'600028',mkt:1,div:0.30,buy:5,cat:'能源资源',divHist:['0.25','0.28','0.29','0.30','0.30']},
{name:'中国石油',code:'601857',mkt:1,div:0.42,buy:8,cat:'能源资源',divHist:['0.35','0.38','0.40','0.41','0.42']},
{name:'美的集团',code:'000333',mkt:0,div:3.00,buy:50,cat:'消费制造',divHist:['2.00','2.40','2.60','2.80','3.00']},
{name:'格力电器',code:'000651',mkt:0,div:3.00,buy:38,cat:'消费制造',divHist:['3.00','2.00','3.38','3.00','3.00']},
{name:'福耀玻璃',code:'600660',mkt:1,div:1.30,buy:35,cat:'消费制造',divHist:['0.80','1.00','1.10','1.20','1.30']},
{name:'伊利股份',code:'600887',mkt:1,div:1.38,buy:28,cat:'消费制造',divHist:['0.96','1.04','1.20','1.22','1.38']},
{name:'贵州茅台',code:'600519',mkt:1,div:30.00,buy:1200,cat:'消费制造',divHist:['19.00','21.00','24.00','28.00','30.00']},
{name:'泸州老窖',code:'000568',mkt:0,div:5.00,buy:180,cat:'消费制造',divHist:['3.50','4.00','4.50','4.80','5.00']},
{name:'海天味业',code:'603288',mkt:1,div:1.50,buy:50,cat:'消费制造',divHist:['1.00','1.10','1.20','1.35','1.50']},
];
var enabled={};
try{enabled=JSON.parse(localStorage.getItem('ve')||'{}')}catch(e){enabled={}}
var saw=localStorage.getItem('ve_seen');
if(!saw){for(var i=0;i<CFG.length;i++)enabled[CFG[i].code]=false;enabled['600036']=true;enabled['601318']=true;save()}
function save(){localStorage.setItem('ve',JSON.stringify(enabled));localStorage.setItem('ve_seen','1')}
function active(){return CFG.filter(function(c){return enabled[c.code]})}
var data=[];

// ═══ 设置页面（完全静态，打开即显示） ═══
(function(){
var catOrder=['大金融','公用事业','能源资源','消费制造'];
var cats={};
for(var k=0;k<catOrder.length;k++)cats[catOrder[k]]=[];
for(var i=0;i<CFG.length;i++)cats[CFG[i].cat].push(CFG[i]);
var h='<div class="panel"><h2>⚙️ 个股显示设置</h2><div style="font-size:11px;color:var(--sub);margin-bottom:12px">首次使用请勾选想关注的股票，然后点确认。之后会自动记忆。</div>';
for(var k=0;k<catOrder.length;k++){
  var cn=catOrder[k];
  h+='<div style="margin-bottom:12px"><div style="font-size:12px;font-weight:700;color:var(--blue);margin-bottom:6px;padding-bottom:3px;border-bottom:1px solid var(--border)">'+cn+'</div>';
  for(var j=0;j<cats[cn].length;j++){
    var c=cats[cn][j],ch=enabled[c.code]?'checked':'';
    h+='<label style="display:flex;align-items:center;padding:8px;border-bottom:1px solid #f0f2f5;cursor:pointer"><input type="checkbox" '+ch+' onchange="tog(\''+c.code+'\',this.checked)" style="margin-right:10px;transform:scale(1.2)"><span style="font-size:13px;font-weight:600">'+c.name+'</span><span style="font-size:10px;color:var(--sub);margin-left:4px">'+c.code+'</span><span style="margin-left:auto;font-size:10px;color:var(--sub)">¥'+c.div.toFixed(2)+'/股</span></label>';
  }
  h+='</div>';
}
h+='<button class="btn" onclick="load()">✅ 确认并刷新行情</button><div style="text-align:center;padding:4px;font-size:10px;color:var(--sub)">勾好后点确认，下次打开自动记忆</div></div>';
document.getElementById('settings').innerHTML=h;
})();

function tog(code,v){enabled[code]=v;save()}

// ═══ 数据加载 ═══
async function fetchOne(mkt,code){
  var u='https://push2.eastmoney.com/api/qt/stock/get?secid='+mkt+'.'+code+'&fields=f43,f60,f162,f167,f116&invt=2&fltt=2&_t='+Date.now();
  try{
    var r=await fetch(u,{cache:'no-store'});
    if(r.ok){var j=await r.json();if(j&&j.data)return j.data}
  }catch(e){}
  return null;
}

async function load(){
  document.getElementById('time').textContent='⏳ 加载中...';
  var list=active();
  if(list.length===0){document.getElementById('time').textContent='⚠️ 请先在设置页勾选股票';return;}
  var pm=list.map(function(c){
    return fetchOne(c.mkt,c.code).then(function(raw){
      var r={name:c.name,code:c.code,cat:c.cat,div:c.div,buy:c.buy,divHist:c.divHist,price:0,prev:0,chg:0,pe:0,pb:0,mcap:0,divR:0,dist:0,needy:0,ok:false};
      if(raw&&raw.f43){r.price=raw.f43;r.prev=raw.f60||0;r.chg=r.prev>0?(r.price/r.prev-1)*100:0;r.pe=raw.f162||0;r.pb=raw.f167||0;r.mcap=(raw.f116||0)/1e8;r.divR=c.div/r.price*100;r.dist=(r.price-c.buy)/c.buy*100;r.needy=c.buy-r.price;r.ok=true;}
      return r;
    }).catch(function(){return {name:c.name,code:c.code,ok:false}});
  });
  data=await Promise.all(pm);
  renderAll();
  document.getElementById('time').textContent=new Date().toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function divZone(d){
  if(d>=6.0)return{label:'极度低估',color:'#2980b9',bg:'#d4ebf7'};
  if(d>=5.5)return{label:'低估',color:'#27ae60',bg:'#d8f0e0'};
  if(d>=5.0)return{label:'合理',color:'#b8860b',bg:'#fffbe0'};
  if(d>=4.0)return{label:'偏贵',color:'#d35400',bg:'#ffe8d0'};
  return{label:'高估',color:'#c0392b',bg:'#fde8e8'};
}

function renderAll(){
  if(!data||data.length===0){document.getElementById('dash').innerHTML='<div class="ldg">⏳ 正在获取行情...</div>';return;}
  // 首页
  var dash='<div style="font-size:12px;font-weight:700;text-align:center;padding:4px 0 8px">📈 股息率价值投资 · 今日判断</div>'+
    '<div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:3px;margin-bottom:10px;font-size:10px">'+
      '<div style="background:#d4ebf7;color:#2980b9;padding:4px 2px;border-radius:4px;text-align:center"><b>≥6.0%</b><br>极度低估</div>'+
      '<div style="background:#d8f0e0;color:#27ae60;padding:4px 2px;border-radius:4px;text-align:center"><b>5.5-6.0%</b><br>低估</div>'+
      '<div style="background:#fffbe0;color:#b8860b;padding:4px 2px;border-radius:4px;text-align:center"><b>5.0-5.5%</b><br>合理</div>'+
      '<div style="background:#ffe8d0;color:#d35400;padding:4px 2px;border-radius:4px;text-align:center"><b>4.0-5.0%</b><br>偏贵</div>'+
      '<div style="background:#fde8e8;color:#c0392b;padding:4px 2px;border-radius:4px;text-align:center"><b>&lt;4.0%</b><br>高估</div>'+
    '</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){dash+='<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:80px"><b>'+r.name+'</b><div style="font-size:11px;color:var(--sub);padding-top:6px">数据加载中</div></div>';continue;}
    var up=r.chg>0,z=divZone(r.divR),pct=Math.max(0,Math.min(100,(r.divR-4)/2*100));
    var nudge=Math.abs(r.needy)<0.5?'🎯目标价范围内':(r.needy>0?'<span style="color:#2980b9">低于目标 ¥'+r.needy.toFixed(2)+'</span>':'<span style="color:var(--red)">高于目标 ¥'+Math.abs(r.needy).toFixed(2)+'</span>');
    dash+='<div style="background:'+z.bg+';border:1px solid var(--border);border-radius:14px;padding:12px;position:relative" onclick="showStock(\''+r.code+'\')">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:4px"><div><span style="font-size:13px;font-weight:700">'+r.name+'</span><span style="font-size:10px;color:var(--sub);margin-left:3px">'+r.code+'</span></div><span style="font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;white-space:nowrap;background:#f0f2f5;color:var(--sub)">'+z.label+'</span></div>'+
      '<div style="font-size:22px;font-weight:800;line-height:1.2">¥'+r.price.toFixed(2)+' <span style="font-size:11px;padding:1px 6px;border-radius:4px;'+(up?'background:#fde8e8;color:var(--red)':'background:#e8f5e9;color:var(--green)')+'">'+(up?'+':'')+r.chg.toFixed(2)+'%</span></div>'+
      '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--sub);margin-top:3px"><span>股息率</span><b style="color:'+z.color+'">'+r.divR.toFixed(2)+'%</b></div>'+
      '<div style="height:4px;background:#eef0f4;border-radius:3px;margin-top:3px;position:relative"><div style="height:100%;border-radius:3px;width:'+pct+'%;background:'+z.color+'"></div><div style="position:absolute;width:8px;height:8px;border-radius:50%;top:-2px;left:'+pct+'%;transform:translateX(-50%);background:'+z.color+';border:2px solid #fff"></div></div>'+
      '<div style="font-size:10px;margin-top:4px">'+nudge+'</div></div>';
  }
  dash+='</div>';
  document.getElementById('dash').innerHTML=dash;
  // 个股详情
  var detail='';
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok){detail+='<div style="background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:6px"><b>'+r.name+'</b><span style="font-size:10px;color:var(--sub)"> 加载中…</span></div>';continue;}
    var z=divZone(r.divR);
    detail+='<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px">'+
      '<div style="display:flex;justify-content:space-between"><div><span style="font-size:16px;font-weight:800">'+r.name+'</span> <span style="font-size:11px;font-weight:700;color:'+z.color+'">（'+z.label+' '+r.divR.toFixed(2)+'%）</span></div><div style="text-align:right"><span style="font-size:18px;font-weight:800">¥'+r.price.toFixed(2)+'</span><br><span style="font-size:11px">PE'+r.pe.toFixed(1)+' PB'+r.pb.toFixed(2)+'</span></div></div></div>';
  }
  document.getElementById('detail').innerHTML='<div style="font-size:11px;color:var(--sub);margin-bottom:10px">实时估值速览</div>'+detail;
  // 监控
  var mon='';var BOND=1.71;
  for(var i=0;i<data.length;i++){
    var r=data[i];
    if(!r.ok)continue;
    var spread=r.divR-BOND,scl=spread>=3?'#27ae60':spread>=1?'#f39c12':'#e74c3c',sp=Math.min(100,Math.max(0,spread/4*100));
    mon+='<div class="panel">'+
      '<div style="font-size:18px;font-weight:800;margin-bottom:8px">'+r.name+'</div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px">'+
        '<div style="background:var(--bg);padding:8px;border-radius:6px"><div style="font-size:10px;color:var(--sub)">股息率TTM</div><div style="font-size:18px;font-weight:800;color:'+scl+'">'+r.divR.toFixed(2)+'%</div></div>'+
        '<div style="background:var(--bg);padding:8px;border-radius:6px"><div style="font-size:10px;color:var(--sub)">股息利差</div><div style="font-size:18px;font-weight:800;color:'+scl+'">'+spread.toFixed(2)+'%</div></div>'+
        '<div style="background:var(--bg);padding:8px;border-radius:6px"><div style="font-size:10px;color:var(--sub)">10年国债</div><div style="font-size:18px;font-weight:800">'+BOND.toFixed(2)+'%</div></div>'+
        '<div style="background:var(--bg);padding:8px;border-radius:6px"><div style="font-size:10px;color:var(--sub)">PE / PB</div><div style="font-size:16px;font-weight:800">'+r.pe.toFixed(1)+' / '+r.pb.toFixed(2)+'</div></div>'+
      '</div>'+
      '<div style="padding:10px;background:'+scl+';color:#fff;border-radius:8px;text-align:center"><div style="font-size:20px;font-weight:800">'+spread.toFixed(2)+'%</div><div style="font-size:11px">当前股息利差</div></div>'+
    '</div>';
  }
  document.getElementById('monitor').innerHTML=mon||'<div class="ldg">暂无启用股票</div>';
  // 持仓
  var opp='<div class="panel"><h2>📊 持仓管理</h2><div style="color:var(--sub);font-size:12px">即将开放。可手动输入持股数和成本计算盈亏。</div></div>';
  document.getElementById('opp').innerHTML=opp;
}

function switchTab(btn,id){
  document.querySelectorAll('.tabs button').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  ['settings','dash','detail','monitor','opp'].forEach(function(k){var e=document.getElementById(k);if(e)e.classList.add('hidden')});
  var e=document.getElementById(id);if(e)e.classList.remove('hidden');
}
function showStock(code){
  var idx=-1;for(var i=0;i<data.length;i++)if(data[i].code===code){idx=i;break}
  if(idx<0)return;
  switchTab(document.querySelector('[data-tab=detail]'),'detail');
}

window.addEventListener('error',function(e){console.error('err',e)});
document.getElementById('time').textContent='👆 点击这里或去设置页选股确认';
</script>
</body>
</html>
